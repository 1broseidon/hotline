<!doctype html>
<meta charset="utf-8">
<title>Hotline social card</title>
<!--
  The source of site/public/og.png: the page's own first screen, as a card.
  The toad is on a call, the line it says is the headline, the sentence under
  it is the owner's. Colours are the page's tokens resolved to sRGB (the paper
  oklch(13.5% 0.007 250) is #06080b, the toad's green oklch(76% 0.17 142) is
  #6bcb62), with the earlier card's cool halo kept over the top centre.
  The toad is drawn by ../public/mark.js, held on one frame of its talking
  pose, so the card and the page never drift apart. Run `make og-card` from
  the app root.
-->
<link rel="stylesheet" href="fonts.css">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: radial-gradient(450px 230px at 50% 0%, #0f141a 0%, #06080b 100%) #06080b; font-family: "IBM Plex Sans"; color: #eceff1; -webkit-font-smoothing: antialiased; }
  svg { display: block; overflow: visible; }
  .toad { position: absolute; left: 96px; top: 142px; width: 150px; height: 107px; color: #6bcb62; }
  .toad .g-all, .toad .g-body, .toad .g-eyeL, .toad .g-eyeR, .toad .g-hand { fill: currentColor; }
  .toad .g-pupils { fill: #06080b; }
  .toad .g-body, .toad .g-eyeL, .toad .g-eyeR, .toad .g-pupils, .toad .g-receiver { transform-box: fill-box; transform-origin: center; }
  .toad .g-line { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  h1 { position: absolute; left: 89px; top: 296px; font: 600 88px/1 "IBM Plex Sans"; letter-spacing: -0.025em; white-space: nowrap; }
  h1 .name { color: #6bcb62; }
  p { position: absolute; left: 96px; top: 416px; width: 940px; font: 400 28px/1.4 "IBM Plex Sans"; color: #adb2b6; }
  .where { position: absolute; left: 96px; top: 548px; font: 400 21px/1 "IBM Plex Sans"; color: #82878c; }
</style>
<svg class="toad" viewBox="4 8 56 40" aria-hidden="true"><g class="g-all"><g class="g-body"><rect x="4" y="30" width="56" height="18" rx="6"/></g><g class="g-eyeL"><circle cx="20" cy="30" r="10.5"/></g><g class="g-eyeR"><circle cx="44" cy="30" r="10.5"/></g><g class="g-pupils"><rect x="14.5" y="28" width="11" height="4" rx="2"/><rect x="38.5" y="28" width="11" height="4" rx="2"/></g><g class="g-hand" opacity="0"><path class="g-receiver" d=""/></g><path class="g-line" d="" opacity="0"/></g></svg>
<h1>Hi, I’m <span class="name">hotline.</span></h1>
<p>I’m an open-source personal agent ecosystem. I work with my teammates, have my own computer, and run on the subscriptions you already pay for.</p>
<div class="where">hotline.dev</div>
<script src="../public/mark.js"></script>
<script>window.hotlineMark(document.querySelector(".toad")).still("writing", 1.2);</script>
