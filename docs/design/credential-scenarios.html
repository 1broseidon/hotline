<style>
:root {
  color-scheme: dark;
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --ground: #0b0b0d;
  --bar: #111114;
  --surface: #17171b;
  --raised: #1f1f25;
  --raised-edge: #2e2e35;
  --rule: #2a2a30;
  --ink: #ececef;
  --ink-2: #b4b4ba;
  --muted: #8e8e95;
  --agent: #8fb8ff;
  --agent-soft: #252c3a;
  --you: #f0c27a;
  --you-soft: #352d24;
  --ok: #86d69c;
  --fail: #ff8f80;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;

  --type-xs: 12px; --type-sm: 14px; --type-md: 16px; --type-lg: 20px;
  --type-xl: 25px; --type-2xl: 31px; --type-3xl: 39px;
  --leading-tight: 1.15; --leading-body: 1.6;
  --measure: 66ch; --rail: 264px; --page-max: 1120px;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 var(--type-md)/var(--leading-body) var(--font-body);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-body); font-style: normal; margin: 0; line-height: var(--leading-tight); overflow-wrap: anywhere; min-width: 0; }
p, li { max-width: var(--measure); }
code { font-family: var(--font-mono); font-size: 0.86em; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
.mono { font-family: var(--font-mono); font-size: var(--type-xs); letter-spacing: 0.03em; line-height: 1.4; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; border-radius: var(--radius-sm); }

/* Frame */
.frame { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100dvh; }
.rail { background: var(--bar); border-right: 1px solid var(--rule); padding: var(--space-6) var(--space-4); position: sticky; top: 0; height: 100dvh; overflow-y: auto; }
.rail .title { font-weight: 600; font-size: var(--type-md); padding: 0 var(--space-3); }
.rail .sub { color: var(--muted); padding: 2px var(--space-3) 0; }
.rail ol { list-style: none; margin: var(--space-5) 0 0; padding: 0; }
.rail .group { color: var(--muted); padding: var(--space-5) var(--space-3) var(--space-1); }
.rail .group:first-child { padding-top: 0; }
.rail li > button {
  all: unset; box-sizing: border-box; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--space-2);
  width: 100%; padding: 6px var(--space-3); border-radius: var(--radius-sm); cursor: pointer;
  color: var(--ink-2); font-size: var(--type-sm); line-height: 1.4;
}
.rail li > button span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail li > button .n { color: var(--muted); font-family: var(--font-mono); font-size: var(--type-xs); padding-top: 2px; }
.rail li > button:hover { background: var(--raised); color: var(--ink); }
.rail li > button[aria-current="true"] { background: var(--agent-soft); color: var(--ink); }
.rail li > button:focus-visible { outline: 2px solid var(--agent); outline-offset: -2px; }

.stage { min-width: 0; display: flex; flex-direction: column; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-7); background: var(--ground); border-bottom: 1px solid var(--rule); }
.bar .where { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--raised-edge); background: var(--raised); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: var(--type-sm); font-weight: 500; white-space: nowrap; min-height: 34px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { color: var(--muted); cursor: default; }
.slide { width: 100%; max-width: var(--page-max); padding: var(--space-8) var(--space-7); }

/* Slide type */
.eyebrow { color: var(--agent); margin-bottom: var(--space-3); }
.slide h2 { font-size: var(--type-2xl); font-weight: 600; letter-spacing: -0.01em; max-width: 30ch; }
.lede { color: var(--ink-2); font-size: var(--type-lg); line-height: 1.5; margin: var(--space-4) 0 0; max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-5); }
.chip { font-family: var(--font-mono); font-size: var(--type-xs); letter-spacing: 0.03em; color: var(--ink-2); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.pager { display: flex; gap: var(--space-2); margin-top: var(--space-6); border-bottom: 1px solid var(--rule); }
.pager button { all: unset; cursor: pointer; font-size: var(--type-sm); color: var(--muted); padding-bottom: 8px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.pager button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--agent); font-weight: 500; }
.pager button + button { margin-left: var(--space-4); }
.mocknote { color: var(--muted); margin-top: var(--space-6); max-width: none; }

/* The sequence */
.seq { display: grid; gap: var(--space-7); margin-top: var(--space-6); }
.step { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
.step .fno { color: var(--agent); }
.step .fcap p { margin: var(--space-2) 0 0; color: var(--ink-2); font-size: var(--type-sm); line-height: 1.55; }
.fmock > .m-wrap:not(:only-child) .m-desk { width: 430px; }
.fmock { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: flex-start; min-width: 0; }

/* What must be true */
.musts { counter-reset: must; list-style: none; padding: 0; margin: var(--space-6) 0 0; display: grid; gap: var(--space-4); }
.musts li { counter-increment: must; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--space-3); font-size: var(--type-lg); line-height: 1.45; max-width: 70ch; }
.musts li::before { content: counter(must, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--type-xs); color: var(--agent); padding-top: 7px; }
.musts .tag { display: block; color: var(--muted); margin-top: 4px; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); margin-top: var(--space-7); }
.notes.one { grid-template-columns: minmax(0, 1fr); }
.note { border-radius: var(--radius-lg); padding: var(--space-5); font-size: var(--type-md); }
.note h3 { font-size: var(--type-sm); font-weight: 600; margin-bottom: var(--space-3); }
.note ul { margin: 0; padding-left: 18px; }
.note li + li { margin-top: var(--space-3); }
.note.today { background: var(--you-soft); }
.note.today h3 { color: var(--you); }
.note.decide { border: 1px solid var(--rule); background: var(--surface); }
.note.decide h3 { color: var(--agent); }
.lean { margin-top: 6px; color: var(--ink-2); font-size: var(--type-sm); }
.lean .mono { color: var(--ok); margin-right: 6px; }

/* Overview slides */
.cover { padding-top: var(--space-5); }
.cover h2 { font-size: var(--type-3xl); max-width: 24ch; }
.ideas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); margin-top: var(--space-7); }
.ideas > div { border-top: 2px solid var(--rule); padding-top: var(--space-4); min-width: 0; }
.ideas > div:first-child { border-top-color: var(--agent); }
.ideas .mono { color: var(--agent); }
.ideas h3 { font-size: var(--type-lg); font-weight: 600; margin: var(--space-2) 0 var(--space-3); }
.ideas p { margin: 0; color: var(--ink-2); font-size: var(--type-sm); line-height: 1.6; }
.ideas .where { color: var(--muted); margin-top: var(--space-3); }
.rulebig { margin-top: var(--space-7); padding: var(--space-5) var(--space-6); border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius-lg); max-width: 72ch; }
.rulebig > .mono { display: block; color: var(--agent); margin-bottom: var(--space-3); }
.rulebig ol { margin: 0; padding-left: 20px; display: grid; gap: var(--space-3); font-size: var(--type-md); line-height: 1.5; }
.rulebig b { font-weight: 600; }
.hint { color: var(--muted); margin-top: var(--space-6); max-width: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6) var(--space-7); margin-top: var(--space-6); }
.grid2 > div { min-width: 0; }
.grid2 h3 { font-size: var(--type-lg); font-weight: 600; margin-bottom: var(--space-3); }
.grid2 ul { margin: 0; padding-left: 18px; color: var(--ink-2); }
.grid2 li + li { margin-top: var(--space-2); }
.pieces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-7) var(--space-6); margin-top: var(--space-6); }
.pieces > div { min-width: 0; }
.pieces h3 { font-size: var(--type-sm); font-weight: 600; margin-bottom: var(--space-2); }
.pieces p { margin: 0 0 var(--space-4); color: var(--muted); font-size: var(--type-sm); }
.pieces .stack { display: grid; gap: var(--space-3); justify-items: start; }
.qlist { margin-top: var(--space-6); display: grid; gap: var(--space-5); }
.qlist > div { border-top: 1px solid var(--rule); padding-top: var(--space-4); display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-5); }
.qlist ul { margin: 0; padding-left: 18px; }
.qlist li + li { margin-top: var(--space-3); }
.qjump { all: unset; cursor: pointer; color: var(--agent); font-weight: 500; font-size: var(--type-sm); }
.qjump:hover { text-decoration: underline; text-underline-offset: 3px; }
.tablewrap { overflow-x: auto; margin-top: var(--space-6); }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: var(--type-sm); }
th, td { text-align: left; vertical-align: top; padding: var(--space-3) var(--space-4) var(--space-3) 0; border-bottom: 1px solid var(--rule); }
th { font-family: var(--font-mono); font-size: var(--type-xs); letter-spacing: 0.03em; font-weight: 500; color: var(--muted); }
td.k { font-weight: 600; white-space: nowrap; }
td { color: var(--ink-2); }

/* ---------- Mockups ---------- */
.m-cap { color: var(--muted); margin: 0 0 6px 2px; }
.m-wrap { display: flex; flex-direction: column; min-width: 0; }

/* Desk chat */
.m-desk { width: 520px; max-width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; font-size: 14px; line-height: 1.5; }
.m-strip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; background: var(--bar); border-bottom: 1px solid var(--rule); font-size: 13px; }
.m-strip b { font-weight: 600; }
.m-strip .dim { color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { width: 20px; height: 20px; border-radius: 50%; background: var(--agent-soft); color: var(--agent); display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
.callpill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: #1d2a22; color: var(--ok); font-size: 12px; }
.callpill i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.m-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.m-msg { display: flex; flex-direction: column; max-width: 88%; }
.m-msg .m-who { color: var(--muted); margin-bottom: 3px; font-size: 11px; }
.m-msg .m-say { padding: 8px 12px; border-radius: 12px; }
.m-msg.mate .m-say { background: var(--raised); border: 1px solid var(--raised-edge); border-bottom-left-radius: 4px; }
.m-msg.you { align-self: flex-end; align-items: flex-end; }
.m-msg.you .m-say { background: var(--you-soft); color: #f4dcb4; border-bottom-right-radius: 4px; }
.m-msg.cut .m-say { border-style: dashed; color: var(--ink-2); }
.m-tool { display: flex; gap: 8px; align-items: baseline; color: var(--muted); font-size: 11.5px; padding: 0 2px; }
.m-tool::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--agent); transform: translateY(-1px); }
.m-tool.warn::before { background: var(--you); }
.m-tool b { color: var(--ink-2); font-weight: 500; }
.m-sys { color: var(--muted); text-align: center; font-size: 11.5px; padding: 2px 0; }

/* Cards in the conversation */
.cc { background: var(--bar); border: 1px solid var(--raised-edge); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; width: 100%; }
.cc.live { border-color: #3a4a66; box-shadow: inset 3px 0 0 var(--agent); }
.cc .eye { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
.cc.live .eye { color: var(--agent); }
.cc .site { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); }
.cc .why { margin: 4px 0 0; color: var(--ink-2); }
.cc .title { font-weight: 500; }
.cc .fine { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.cc .settled { color: var(--ink-2); }
.cc .settled .k, .k { font-family: var(--font-mono); font-size: 0.92em; color: var(--ink); }
.cc .out { color: var(--muted); font-size: 12px; margin-top: 2px; }
.fields { display: grid; gap: 8px; margin-top: 10px; }
.fields.two { grid-template-columns: 1fr 1fr; }
.fld { display: grid; gap: 3px; min-width: 0; }
.fld > span { color: var(--muted); font-size: 11.5px; }
.in { height: 30px; display: flex; align-items: center; padding: 0 10px; background: var(--ground); border: 1px solid var(--raised-edge); border-radius: 7px; color: var(--ink); font-size: 13px; overflow: hidden; white-space: nowrap; }
.in.dots { letter-spacing: 2px; font-size: 12px; }
.in.ph { color: #5d5d64; }
.in.mono { font-family: var(--font-mono); font-size: 12.5px; }
.in.focus { border-color: var(--agent); }
.in .lock { margin-left: auto; color: var(--muted); font-size: 11px; font-family: var(--font-mono); letter-spacing: 0; }
.tog { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--ink-2); font-size: 13px; }
.sw { width: 28px; height: 16px; border-radius: 999px; background: var(--raised-edge); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-2); }
.sw.on { background: var(--agent); }
.sw.on::after { left: 14px; background: var(--ground); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.b { height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--raised-edge); background: var(--raised); color: var(--ink); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; white-space: nowrap; }
.b.pri { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.b.ghost { background: none; border-color: var(--rule); color: var(--ink-2); }
.b.press { outline: 2px solid var(--agent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--raised-edge); border-radius: 7px; overflow: hidden; font-size: 12px; }
.seg span { padding: 3px 9px; color: var(--muted); }
.seg span.on { background: var(--raised-edge); color: var(--ink); }

/* Phone */
.m-phone { width: 300px; flex: none; background: var(--ground); border: 1px solid var(--raised-edge); border-radius: 38px; padding: 10px; font-size: 13.5px; line-height: 1.45; }
.ph-in { border-radius: 30px; background: #0f0f12; overflow: hidden; min-height: 420px; display: flex; flex-direction: column; }
.ph-status { display: flex; justify-content: space-between; padding: 12px 22px 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
.ph-status .isl { width: 84px; height: 22px; background: #000; border-radius: 999px; }
.ph-head { display: flex; align-items: center; gap: 8px; padding: 8px 14px 10px; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
.ph-head b { font-weight: 600; }
.ph-head .callpill { margin-left: auto; }
.ph-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.ph-body .m-msg { max-width: 92%; }
.ph-body .cc { padding: 12px; }
.ph-body .in { height: 36px; font-size: 14px; }
.ph-body .acts .b { height: 34px; flex: 1; justify-content: center; }
.ph-lock { padding: 26px 14px 18px; text-align: center; }
.ph-lock .time { font-size: 56px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.ph-lock .date { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
.push { margin: 18px 4px 0; text-align: left; background: rgba(40, 40, 46, 0.92); border: 1px solid var(--raised-edge); border-radius: 18px; padding: 10px 12px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.push .ic { width: 28px; height: 28px; border-radius: 7px; background: var(--surface); border: 1px solid var(--raised-edge); display: grid; place-items: center; color: var(--agent); font-size: 12px; font-weight: 700; }
.push .t { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.push .t span { color: var(--muted); font-weight: 400; font-size: 11.5px; }
.push .s { color: var(--ink-2); font-size: 13px; }
.kbd { margin-top: auto; background: #1b1b20; border-top: 1px solid var(--rule); padding: 8px 6px 14px; display: grid; gap: 6px; }
.kbd .r { display: flex; gap: 4px; justify-content: center; }
.kbd .r i { width: 22px; height: 30px; border-radius: 5px; background: #2c2c33; }
.kbd .bar2 { color: var(--muted); font-size: 11px; text-align: center; padding-bottom: 2px; }

/* The computer's browser page */
.m-page { width: 660px; max-width: 100%; border: 1px solid var(--raised-edge); border-radius: 12px; overflow: hidden; background: #e9e9ed; }
.pg-strip { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; background: var(--bar); border-bottom: 1px solid var(--rule); color: var(--ink-2); font-size: 12px; }
.pg-strip .lockic { color: var(--muted); }
.pg-strip .url { background: var(--raised); border-radius: 6px; padding: 2px 10px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pg-strip .who { color: var(--agent); white-space: nowrap; font-family: var(--font-body); font-size: 11.5px; }
.pg-body { position: relative; min-height: 440px; padding: 40px 0 0 48px; color: #34343a; font-size: 13px; }
.sf { width: 240px; display: grid; gap: 10px; }
.sf .brand { font-weight: 600; font-size: 17px; color: #222226; margin-bottom: 6px; }
.sf .lab { font-size: 12px; color: #55555c; margin-bottom: -6px; }
.sf .box { height: 30px; border-radius: 6px; background: #fff; border: 1px solid #c8c8ce; display: flex; align-items: center; padding: 0 9px; font-size: 12.5px; color: #34343a; }
.sf .box.dots { letter-spacing: 2px; }
.sf .go { height: 32px; border-radius: 6px; background: #3b3b42; color: #f1f1f3; display: grid; place-items: center; font-weight: 500; font-size: 12.5px; margin-top: 2px; }
.sf .alt { height: 32px; border-radius: 6px; background: #fff; border: 1px solid #c8c8ce; display: grid; place-items: center; font-size: 12.5px; color: #34343a; }
.sf .alt.hit { outline: 2px solid var(--agent); outline-offset: 2px; }
.sf .or { text-align: center; font-size: 11.5px; color: #7a7a82; }
.sf .shade { height: 10px; border-radius: 4px; background: #d4d4da; }
.sf .shade.w60 { width: 60%; } .sf .shade.w80 { width: 80%; }
.sf .go, .sf .alt { position: relative; }
.pointer { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); font-size: 11px; background: var(--agent); color: #0b0b0d; padding: 1px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; }

/* The extension card on the page */
.xc { position: absolute; top: 14px; right: 14px; width: 292px; background: var(--surface); border: 1px solid var(--raised-edge); border-radius: 14px; color: var(--ink); font-size: 12.5px; line-height: 1.45; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); overflow: hidden; }
.xc-h { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-bottom: 1px solid var(--rule); }
.xc-h b { font-weight: 600; font-size: 12.5px; }
.xc-h .s { margin-left: auto; color: var(--muted); font: 11.5px var(--font-mono); }
.xc-h .x { color: var(--muted); font-size: 14px; margin-left: 4px; }
.xc-m { padding: 4px 6px 6px; }
.xc .sec { padding: 8px 8px 2px; color: var(--muted); font: 10.5px var(--font-mono); letter-spacing: 0.04em; }
.xrow { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; }
.xrow .ico { width: 26px; height: 26px; border-radius: 7px; background: var(--raised); border: 1px solid var(--raised-edge); display: grid; place-items: center; flex: none; color: var(--ink-2); }
.xrow .ico svg { width: 13px; height: 13px; }
.xrow .w { flex: 1; min-width: 0; }
.xrow .w div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xrow .t { font-weight: 500; }
.xrow .s { color: var(--muted); font-size: 11.5px; }
.xrow .b { height: 24px; font-size: 12px; padding: 0 10px; }
.xrow.new { background: var(--agent-soft); }
.xban { margin: 4px 2px 2px; padding: 9px 10px; border-radius: 9px; background: var(--raised); border: 1px solid var(--raised-edge); }
.xban .t { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.xban .t i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--you); }
.xban.ok .t i { background: var(--ok); }
.xban.fail .t i { background: var(--fail); }
.xban.agent .t i { background: var(--agent); }
.xban.wait .t i { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.35; } }
.xban .s { color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
.xban .k { font-size: 11.5px; }
.xlog { display: flex; gap: 8px; padding: 4px 8px; font-size: 11.5px; color: var(--ink-2); }
.xlog .at { width: 34px; flex: none; color: var(--muted); font: 11px var(--font-mono); padding-top: 1px; }
.xlog .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--ok); }
.xlog .dot.fail { background: var(--fail); }
.xlog .dot.wait { background: var(--you); }
.xempty { padding: 10px 8px; color: var(--ink-2); }
.xfoot { padding: 7px 12px 9px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 11px; }

/* Notes on the page, bottom right */
.pg-notes { position: absolute; right: 14px; bottom: 14px; display: grid; gap: 8px; justify-items: end; }
.pn { background: var(--surface); border: 1px solid var(--raised-edge); border-radius: 10px; padding: 8px 12px 8px 10px; display: grid; grid-template-columns: 8px auto; gap: 2px 8px; align-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); max-width: 330px; }
.pn i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.pn.fail i { background: var(--fail); }
.pn .t { color: var(--ink); font-size: 12.5px; font-weight: 500; }
.pn .s { grid-column: 2; color: var(--muted); font-size: 11.5px; }

/* Settings list */
.m-set { width: 520px; max-width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; font-size: 13px; }
.m-set .hd { display: flex; gap: 8px; align-items: baseline; padding: 12px 14px; border-bottom: 1px solid var(--rule); background: var(--bar); }
.m-set .hd b { font-weight: 600; }
.m-set .hd span { color: var(--muted); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.srow:last-child { border-bottom: 0; }
.srow .n { font-family: var(--font-mono); font-size: 12.5px; }
.srow .d { color: var(--muted); font-size: 12px; grid-column: 1; }
.srow .seg { grid-row: 1 / span 2; grid-column: 2; }

/* The call tape */
.m-call { width: 520px; max-width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; font-size: 14px; line-height: 1.5; }

/* macOS prompt */
.m-mac { width: 520px; max-width: 100%; height: 300px; border: 1px solid var(--raised-edge); border-radius: 12px; background: linear-gradient(160deg, #1b2230, #121318); display: grid; place-items: center; }
.mac-sheet { width: 280px; background: rgba(44, 44, 50, 0.96); border: 1px solid #3a3a42; border-radius: 14px; padding: 18px 18px 14px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
.fp { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 50%; border: 2px solid var(--fail); position: relative; }
.fp::before, .fp::after { content: ""; position: absolute; border-radius: 50%; border: 2px solid var(--fail); }
.fp::before { inset: 7px; }
.fp::after { inset: 14px; }
.mac-sheet .t { font-weight: 600; font-size: 13.5px; }
.mac-sheet .s { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.mac-sheet .h { color: var(--muted); font-size: 11.5px; margin-top: 10px; }
.mac-sheet .acts { justify-content: center; }
.mac-sheet .b { height: 26px; font-size: 12px; }
.osnote { color: var(--muted); font-size: 11px; margin-top: 8px; font-family: var(--font-mono); }

@media (max-width: 1180px) {
  .step { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
}
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .bar { padding: var(--space-3) var(--space-4); }
  .slide { padding: var(--space-6) var(--space-4) var(--space-7); }
  .notes, .grid2, .ideas, .pieces, .qlist > div { grid-template-columns: minmax(0, 1fr); }
  .slide h2 { font-size: var(--type-xl); }
  .cover h2 { font-size: var(--type-2xl); }
  .lede, .musts li { font-size: var(--type-md); }
}
</style>
</head>
<body>
<div class="frame">
  <nav class="rail" aria-label="Slides">
    <div class="title">Credential scenarios</div>
    <div class="sub mono">epic-24 · 2026-10-21</div>
    <ol id="index"></ol>
  </nav>
  <div class="stage">
    <div class="bar">
      <span class="where mono" id="where" aria-live="polite"></span>
      <button class="btn" type="button" id="prev">Back</button>
      <button class="btn" type="button" id="next">Next</button>
    </div>
    <main class="slide" id="slide" tabindex="-1"></main>
  </div>
</div>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Plain text with `code` spans.
const rich = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

/* ---------- Mockup vocabulary ---------- */
const ICON = {
  key: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="3"/><path d="M8.2 8.2 14 14M11.5 11.5l1.8-1.8"/></svg>',
  lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
};
const cap = (s) => `<div class="m-cap mono">${esc(s)}</div>`;
const wrap = (label, inner) => `<div class="m-wrap">${label ? cap(label) : ""}${inner}</div>`;

// Desk chat pane.
const desk = (where, items, { call } = {}) => wrap("Desk", `<div class="m-desk"><div class="m-strip"><span class="av">P</span><b>Pork Chop</b>${call ? `<span class="callpill"><i></i>On a call · ${esc(call)}</span>` : ""}<span class="dim mono">${esc(where)}</span></div><div class="m-body">${items.join("")}</div></div>`);
const mate = (s, who = "Pork Chop") => `<div class="m-msg mate"><div class="m-who mono">${esc(who)}</div><div class="m-say">${rich(s)}</div></div>`;
const you = (s, who) => `<div class="m-msg you">${who ? `<div class="m-who mono">${esc(who)}</div>` : ""}<div class="m-say">${rich(s)}</div></div>`;
const cutl = (s, who = "Pork Chop") => `<div class="m-msg mate cut"><div class="m-who mono">${esc(who)} · cut off</div><div class="m-say">${rich(s)}</div></div>`;
const tool = (name, s, warn) => `<div class="m-tool mono${warn ? " warn" : ""}"><span><b>${esc(name)}</b> · ${esc(s)}</span></div>`;
const sys = (s) => `<div class="m-sys mono">${esc(s)}</div>`;

// The credential card. state: pending | stored | declined | expired | withdrawn | arming
function cred(o = {}) {
  const site = o.site ?? "https://github.com";
  const host = site.replace(/^https?:\/\//, "");
  const name = o.name ?? "GITHUB_LOGIN";
  const kind = o.kind ?? "login";
  const K = kind === "passkey" ? "Passkey" : "Login";
  const state = o.state ?? "pending";
  const seat = o.seat ? ` · ${esc(o.seat)}` : "";
  if (state === "stored") return `<div class="cc"><div class="eye mono">${K} · Stored${seat}</div><div class="settled">Stored as <span class="k">${esc(name)}</span> for ${esc(host)} · granted to Pork Chop</div>${o.ask ? `<div class="out">Ask me before each use</div>` : ""}</div>`;
  if (state === "declined") return `<div class="cc"><div class="eye mono">${K} · Declined${seat}</div><div class="settled"><span class="k">${esc(host)}</span> · nothing stored</div></div>`;
  if (state === "expired") return `<div class="cc"><div class="eye mono">${K} · Expired</div><div class="settled"><span class="k">${esc(host)}</span> · no answer in 30 min · nothing stored</div></div>`;
  if (state === "withdrawn") return `<div class="cc"><div class="eye mono">${K} · Withdrawn</div><div class="settled"><span class="k">${esc(host)}</span> · Pork Chop no longer needs it · nothing stored</div></div>`;
  if (state === "arming") return `<div class="cc"><div class="eye mono">Passkey · Ready to make</div><div class="settled">Armed for <span class="k">${esc(host)}</span>. When the site asks to make it, its approval card comes next.</div></div>`;
  const filled = o.filled !== false;
  const fields = kind === "passkey"
    ? `<p class="fine">No fields to fill. The computer makes the passkey when the site asks, after you approve that request. Its private key never enters the browser.</p>`
    : `<div class="fields${o.narrow ? "" : " two"}">
        <label class="fld"><span>Username</span><div class="in${filled ? "" : " ph"}">${filled ? esc(o.user ?? "1broseidon") : "Username"}</div></label>
        <label class="fld"><span>Password</span><div class="in dots${filled ? " focus" : " ph"}">${filled ? "••••••••••••" : ""}${o.autofill ? `<span class="lock">Passwords</span>` : ""}</div></label>
      </div>
      <div class="fields"><label class="fld"><span>One-time code seed</span><div class="in ph">Optional</div></label></div>`;
  return `<div class="cc live">
    <div class="eye mono">Needs you · ${K}</div>
    <div class="site">${esc(site)}</div>
    <p class="why">${rich(o.reason ?? "To open the 0.43 release draft. GitHub asks me to sign in and I have no key for it.")}</p>
    ${fields}
    <div class="fields"><label class="fld"><span>Name for the key</span><div class="in mono">${esc(name)}</div></label></div>
    <div class="tog"><span class="sw${o.ask ? " on" : ""}"></span>Ask me before each use</div>
    ${kind === "passkey" ? "" : `<p class="fine">Goes to the vault and Pork Chop's computer, nowhere else. Pork Chop learns the name, never the values.</p>`}
    <div class="acts"><span class="b pri${o.press === "save" ? " press" : ""}">${kind === "passkey" ? "Make a passkey" : "Save"}</span><span class="b${o.press === "decline" ? " press" : ""}">Decline</span></div>
  </div>`;
}

// The approval card for an ask-me key's use. state: pending | approved | allowed | denied | expired
function useAsk(o = {}) {
  const key = o.key ?? "GH_PASSKEY", site = o.site ?? "github.com", kind = o.kind ?? "passkey";
  const head = `Pork Chop wants to sign in to ${esc(site)} with <span class="k">${esc(key)}</span>`;
  const seat = o.seat ? ` · ${esc(o.seat)}` : "";
  const settled = { approved: "Approved once", allowed: `Allowed until ${o.until ?? "22:41"}`, denied: "Denied", expired: "Expired" }[o.state];
  if (settled) return `<div class="cc"><div class="eye mono">Key use · ${settled}${seat}</div><div class="settled">${head}</div>${o.state === "expired" ? `<div class="out">The page stopped waiting before an answer.</div>` : ""}</div>`;
  return `<div class="cc live"><div class="eye mono">Needs you · Key use</div><div class="title">${head}</div>
    <p class="fine" style="margin-top:4px">${kind === "passkey" ? "Passkey" : "Login"} · ask me. The page is held until you answer.</p>
    <div class="acts"><span class="b pri${o.press === "approve" ? " press" : ""}">Approve</span><span class="b${o.press === "allow" ? " press" : ""}">Allow 10 min</span><span class="b${o.press === "deny" ? " press" : ""}">Deny</span></div></div>`;
}

// The passkey approval card that exists today (PasskeyAskCard).
function pkAsk(o = {}) {
  if (o.state === "approved") return `<div class="cc"><div class="eye mono">Passkey · Approved</div><div class="settled">github.com asks to make a passkey for Pork Chop.</div><div class="out">Stored as <span class="k">GH_PASSKEY</span> and ticked for this teammate once made.</div></div>`;
  return `<div class="cc live"><div class="eye mono">Needs you · Passkey</div><div class="title">github.com asks to make a passkey for Pork Chop.</div>
    <p class="fine" style="margin-top:4px">The request came from https://github.com. Approved, the passkey is stored as <span class="k">GH_PASSKEY</span> and ticked for this teammate. Denied, the site hears no and the arming ends.</p>
    <div class="acts"><span class="b pri${o.press ? " press" : ""}">Approve</span><span class="b">Deny</span></div></div>`;
}

// Cards that exist today, for the pieces slide.
const approvalCard = () => `<div class="cc live"><div class="eye mono">Needs you · Approval</div><div class="title">Pork Chop wants to push release/0.43.0.</div><div class="acts"><span class="b pri">Yes</span><span class="b">No</span></div></div>`;
const humanCard = () => `<div class="cc live"><div class="eye mono">Needs you · On the computer</div><div class="title">Solve the CAPTCHA on vercel.com.</div><p class="fine" style="margin-top:4px">The screen is yours until you press Done.</p><div class="acts"><span class="b pri">Done</span><span class="b">Decline</span></div></div>`;

// Phone: a chat column, a lock screen, or a call.
function phone(items, o = {}) {
  const head = `<div class="ph-head"><span class="av">P</span><b>Pork Chop</b>${o.call ? `<span class="callpill"><i></i>${esc(o.call)}</span>` : ""}</div>`;
  const kbd = o.kbd ? `<div class="kbd"><div class="bar2 mono">Passwords · 1broseidon (github.com)</div><div class="r">${"<i></i>".repeat(10)}</div><div class="r">${"<i></i>".repeat(9)}</div><div class="r">${"<i></i>".repeat(7)}</div></div>` : "";
  return wrap(o.label ?? "Phone", `<div class="m-phone"><div class="ph-in"><div class="ph-status"><span>${o.time ?? "22:14"}</span><span class="isl"></span><span>5G</span></div>${head}<div class="ph-body">${items.join("")}</div>${kbd}</div></div>`);
}
function lockscreen(title, body, o = {}) {
  return wrap(o.label ?? "Phone", `<div class="m-phone"><div class="ph-in"><div class="ph-status"><span></span><span class="isl"></span><span>5G</span></div><div class="ph-lock"><div class="time">${o.time ?? "22:12"}</div><div class="date">Wednesday 21 October</div><div class="push"><div class="ic">H</div><div><div class="t">${esc(title)}<span>now</span></div><div class="s">${esc(body)}</div></div></div></div></div></div>`);
}

// The computer's browser page, with the extension card and notes.
function signin(o = {}) {
  const brand = o.brand ?? "GitHub";
  if (o.kind === "security") return `<div class="sf"><div class="brand">${esc(brand)}</div><div class="shade w80"></div><div class="shade w60"></div><div class="lab" style="margin-top:8px">Passkeys</div><div class="shade"></div><div class="alt${o.hit ? " hit" : ""}">Add a passkey${o.hit ? '<span class="pointer">Pork Chop</span>' : ""}</div></div>`;
  return `<div class="sf"><div class="brand">Sign in to ${esc(brand)}</div>
    <div class="lab">Username or email</div><div class="box">${o.user ? esc(o.user) : ""}</div>
    <div class="lab">Password</div><div class="box dots">${o.pass ? "••••••••••" : ""}</div>
    <div class="go">Sign in${o.hitSignin ? '<span class="pointer">Pork Chop</span>' : ""}</div>
    ${o.passkey === false ? "" : `<div class="or">or</div><div class="alt${o.hit ? " hit" : ""}">Sign in with a passkey${o.hit ? '<span class="pointer">Pork Chop</span>' : ""}</div>`}</div>`;
}
function page(o) {
  return wrap(o.label ?? "Computer · the teammate's browser", `<div class="m-page"><div class="pg-strip mono"><span class="lockic">●</span><span class="url">${esc(o.url)}</span><span class="who">Pork Chop at work</span></div><div class="pg-body">${o.form ?? signin()}${o.card ?? ""}${o.notes?.length ? `<div class="pg-notes">${o.notes.join("")}</div>` : ""}</div></div>`);
}
function ext(o = {}) {
  const ban = o.banner ? `<div class="xban ${o.banner.tone ?? ""}"><div class="t"><i></i>${esc(o.banner.t)}</div>${o.banner.s ? `<div class="s">${o.banner.s}</div>` : ""}</div>` : "";
  const rows = (o.rows ?? []).join("");
  const rec = o.record?.length ? `<div class="sec">today here</div>${o.record.join("")}` : "";
  const empty = o.empty ? `<div class="xempty">Nothing for this site. Grant a login or passkey from the desk.</div>` : "";
  return `<div class="xc"><div class="xc-h"><b>Hotline</b><span class="s">${esc(o.site ?? "github.com")}</span><span class="x">×</span></div><div class="xc-m">${ban}${rows}${empty}${rec}</div><div class="xfoot">Keys never enter the browser.</div></div>`;
}
const xrow = (icon, t, s, btn, isNew) => `<div class="xrow${isNew ? " new" : ""}"><div class="ico">${ICON[icon]}</div><div class="w"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></div>${btn ? `<span class="b">${esc(btn)}</span>` : ""}</div>`;
const passkeyRow = (u = "1broseidon") => xrow("key", u, "passkey · used when the page asks");
const loginRow = (name = "GITHUB_LOGIN", u = "1broseidon", isNew) => xrow("lock", u, `${name} · from this computer`, "Fill", isNew);
const rec = (at, s, tone) => `<div class="xlog"><span class="at">${esc(at)}</span><span class="dot ${tone ?? ""}"></span><span>${esc(s)}</span></div>`;
const pnote = (t, s, fail) => `<div class="pn${fail ? " fail" : ""}"><i></i><span class="t">${esc(t)}</span><span class="s">${esc(s)}</span></div>`;

function settings(rows) {
  return wrap("Desk · Settings → Secrets", `<div class="m-set"><div class="hd"><b>Secrets</b><span class="mono">each key's name, site and use</span></div>${rows.map(([n, d, ask]) => `<div class="srow"><span class="n">${esc(n)}</span><span class="d">${esc(d)}</span><span class="seg"><span class="${ask ? "" : "on"}">Automatic</span><span class="${ask ? "on" : ""}">Ask me</span></span></div>`).join("")}</div>`);
}
const callTape = (items) => wrap("The call", `<div class="m-call"><div class="m-strip"><span class="av">P</span><b>Pork Chop</b><span class="callpill"><i></i>On a call · 2:14</span><span class="dim mono">Phone · live voice</span></div><div class="m-body">${items.join("")}</div></div>`);
const macPrompt = () => wrap("Desk's Mac · drawn by macOS", `<div class="m-mac"><div><div class="mac-sheet"><div class="fp"></div><div class="t">Hotline wants to sign in to github.com</div><div class="s">With your passkey for 1broseidon, saved in your passwords app.</div><div class="h">Touch ID or enter your password</div><div class="acts"><span class="b">Cancel</span></div></div><div class="osnote" style="text-align:center">The OS prompt is the approval</div></div></div>`);

/* ---------- The scenes ---------- */
const F = (where, cap, ...mocks) => ({ where, cap, mocks });
const S = (o) => ({ kind: "scenario", ...o });

const slides = [
  { kind: "cover", group: "Start", title: "Credential scenarios" },
  { kind: "pieces", group: "Start", title: "The pieces" },

  S({ group: "Capture", title: "A login, asked for in the chat",
    lede: "Pork Chop reaches GitHub's sign-in page with no key for it. It asks in the chat; you type the login into the card. The values go to the vault and to its computer, never to the agent.",
    setting: ["Desk window", "Pork Chop (Claude Code)", "Computer rc.6+", "github.com"],
    frames: [
      F("Computer", "Pork Chop opens the sign-in page. Its computer holds no key for github.com, and the card on the page says so.",
        page({ url: "https://github.com/login", card: ext({ empty: true }) })),
      F("Desk", "It calls `request_credential` and a credential card appears in the chat. You type the login, keep the name it proposed and press Save.",
        desk("Home", [mate("I need to sign in to GitHub to open the 0.43 release draft. I've asked for a login below."), tool("request_credential", "https://github.com · login · GITHUB_LOGIN"), cred({ press: "save" })])),
      F("Desk", "The card collapses to what was stored, with no values. Pork Chop's answer names the key and how to use it.",

/* ---------- Rendering ---------- */
const list = (items) => `<ul>${items.map((i) => `<li>${rich(i)}</li>`).join("")}</ul>`;
const asks = (items) => `<ul>${items.map((a) => `<li>${rich(a.q)}<div class="lean"><span class="mono">Lean</span>${rich(a.lean)}</div></li>`).join("")}</ul>`;

const pages = [];
let sceneNo = 0;
slides.forEach((s, i) => {
  if (s.kind === "scenario") {
    s.no = ++sceneNo;
    pages.push({ slide: i, part: "seq" }, { slide: i, part: "rules" });
  } else pages.push({ slide: i, part: null });
});

function head(s, part) {
  return `
    <div class="eyebrow mono">Scene ${s.no} · ${esc(s.group)}</div>
    <h2>${esc(s.title)}</h2>
    <p class="lede">${rich(s.lede)}</p>
    <div class="chips">${s.setting.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="pager" role="tablist" aria-label="Parts of this scene">
      <button type="button" data-part="seq" aria-current="${part === "seq"}">The sequence</button>
      <button type="button" data-part="rules" aria-current="${part === "rules"}">What must be true</button>
    </div>`;
}

function sequence(s) {
  return `${head(s, "seq")}
    <div class="seq">${s.frames.map((f, i) => `
      <div class="step">
        <div class="fcap"><div class="fno mono">${i + 1} · ${esc(f.where)}</div><p>${rich(f.cap)}</p></div>
        <div class="fmock">${f.mocks.join("")}</div>
      </div>`).join("")}
    </div>
    <p class="mocknote mono">Drawings, not screenshots. Names, times and lines are illustrative.</p>`;
}

function rules(s) {
  const notes = [
    s.gap ? `<div class="note today"><h3>Today</h3>${list(s.gap)}</div>` : "",
    s.ask ? `<div class="note decide"><h3>For you to decide</h3>${asks(s.ask)}</div>` : "",
  ].filter(Boolean);
  return `${head(s, "rules")}
    <ol class="musts">${s.must.map(([m, tag]) => `<li><span>${rich(m)}<span class="tag mono">${esc(tag)}</span></span></li>`).join("")}</ol>
    ${notes.length ? `<div class="notes${notes.length === 1 ? " one" : ""}">${notes.join("")}</div>` : ""}`;
}

const views = {
  cover: () => `
    <div class="cover">

      <div class="ideas">
        <div><span class="mono">Idea 1</span><h3>Capture in the chat</h3><p>A teammate at a sign-in page with no key raises a credential card, on the desk and the phone. You type the login there. It goes straight into the vault, is granted to that teammate for that site, and reaches its computer.</p><p class="where mono">Scenes 1–4</p></div>

      </div>
      <div class="rulebig"><span class="mono">The rules</span><ol>
        <li><b>Never by voice.</b> A credential is never asked for or answered on a call. Its card shows on the desk and the phone only.</li>
        <li><b>Values never in a note, a tape or the agent.</b> What's typed in a card's fields goes to the vault and the computer, and nowhere else.</li>
        <li><b>The agent sees names only.</b> It learns a key's name and kind, never its value.</li>
      </ol></div>
      <p class="hint mono">← → to move · each scene has two pages: the sequence, then what must be true</p>
    </div>`,

  pieces: () => `
    <div class="eyebrow mono">Start</div>
    <h2>The pieces, drawn once</h2>
    <p class="lede">Two new cards in the chat, three new states on the computer's card, and the notes the page already shows. The approval and human-action cards exist today.</p>
    <div class="pieces">
      <div><h3>Credential card</h3><p>Site origin in full, the reason, secure fields, a name, Ask me. After Save, no values.</p><div class="stack">${cred()}${cred({ state: "stored" })}</div></div>
      <div><h3>Key-use approval</h3><p>For an ask-me key, on the desk and the phone.</p><div class="stack">${useAsk()}${useAsk({ state: "allowed" })}</div>
        <h3 style="margin-top:24px">In the chat today</h3><p>Approval and human-action cards, unchanged.</p><div class="stack">${approvalCard()}${humanCard()}</div></div>
      <div style="grid-column:1/-1"><h3>The computer's card (rc.6), with its new states</h3><p>Top right of the page. Keys, a record of today's uses, and now waiting, approved and new-login.</p>
        <div class="stack" style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">${page({ label: "", url: "https://github.com/login", form: signin(), card: ext({ banner: { tone: "wait", t: "Waiting for approval at the desk", s: '<span class="k">GH_PASSKEY</span> · for Pork Chop' }, rows: [passkeyRow(), loginRow()], record: [rec("22:31", "Pork Chop signed in · approved at the desk"), rec("22:20", "Pork Chop filled a login")] }), notes: [pnote("Pork Chop signed in to github.com", "with the passkey on this computer")] })}<div class="stack">${pnote("Refused a login on github.io", "not a site the login is for; Pork Chop was stopped", true)}
        ${[
          { tone: "wait", t: "Waiting for approval at the desk", s: '<span class="k">GH_PASSKEY</span> · for Pork Chop' },
          { tone: "ok", t: "Approved", s: "at the desk · 22:31" },
          { tone: "fail", t: "Declined at the desk", s: "The site was told no." },
          { tone: "agent", t: "New login for this site: GITHUB_LOGIN", s: "Granted to Pork Chop at the desk" },
        ].map((b) => `<div class="xc" style="position:static;box-shadow:none"><div class="xc-m"><div class="xban ${b.tone}"><div class="t"><i></i>${esc(b.t)}</div><div class="s">${b.s}</div></div></div></div>`).join("")}
      </div></div></div>
    </div>`,

  rules: () => `
    <div class="eyebrow mono">Rules</div>
    <h2>Rules every scene shares</h2>
    <div class="grid2">
      <div><h3>Values</h3><ul>
        <li>Typed only into a card's secure fields, on the desk or the phone.</li>
        <li>Sent once, in <code>secrets.capture.answer</code>; stored in the OS keychain; reach the computer only through <code>PUT /secrets</code>.</li>
        <li>Never in the tape, the transcript, a note, a draft, the phone's cache, analytics or logs.</li>
        <li>Fields clear on Save, Decline, dismiss and expiry.</li>
      </ul></div>
      <div><h3>Names</h3><ul>
        <li>The agent learns a key's name and kind, never its value.</li>
        <li>A settled card shows name, site and teammate. Nothing else.</li>
        <li>The agent fills by name: <code>browser fill secret NAME.password</code>.</li>
      </ul></div>
      <div><h3>Cards</h3><ul>
        <li>A credential card or key-use approval is never asked, read out or answered by voice.</li>
        <li>Every card settles on every seat at once and can't be answered twice.</li>
        <li>Declined, expired or withdrawn: nothing stored; the agent is told plainly and stops.</li>

      <div><h3>The page</h3><ul>
        <li>Every use of a key the agent makes leaves a note on the page and a line in the card's record, automatic or not.</li>

  stories: () => `
    <div class="eyebrow mono">Rules</div>

        <tr><td class="k">task-268</td><td>Computer</td><td>Hold an ask-me use; waiting, approved and new-login states on the page's card</td><td>1, 5, 6</td></tr>
        <tr><td class="k">task-269</td><td>Spike</td><td>Can the desk ask macOS and Windows for a passkey for any site?</td><td>8</td></tr>
        <tr><td class="k">task-270</td><td>Desk, computer</td><td>Passkeys in your own provider, signed on the host (only if the spike says yes)</td><td>8</td></tr>
      </tbody>
    </table></div>`,

  questions: () => {
    const qs = slides.map((s, i) => [s, i]).filter(([s]) => s.ask);
    return `
    <div class="eyebrow mono">Rules</div>
    <h2>Questions for you</h2>
    <p class="lede">Collected from the scenes, each with my lean. Your answers go on epic-24 before the stories are dispatched.</p>
    <div class="qlist">${qs.map(([s, i]) => `<div><div><span class="mono" style="color:var(--muted)">Scene ${s.no}</span><br><button type="button" class="qjump" data-slide="${i}">${esc(s.title)}</button></div>${asks(s.ask)}</div>`).join("")}</div>`;
  },
};

const index = document.getElementById("index");
const slideEl = document.getElementById("slide");
const where = document.getElementById("where");
let current = 0;

let lastGroup = null;
slides.forEach((s, i) => {
  if (s.group !== lastGroup) {
    const g = document.createElement("li");
    g.className = "group mono";
    g.textContent = s.group;
    index.appendChild(g);
    lastGroup = s.group;
  }
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.slide = i;
  b.innerHTML = `<span class="n">${s.no ?? "·"}</span><span>${esc(s.title)}</span>`;
  b.addEventListener("click", () => show(pages.findIndex((p) => p.slide === i)));
  li.appendChild(b);
  index.appendChild(li);
});

function show(next) {
  current = Math.max(0, Math.min(pages.length - 1, next));
  const page = pages[current];
  const s = slides[page.slide];
  slideEl.innerHTML = page.part === "seq" ? sequence(s) : page.part === "rules" ? rules(s) : views[s.kind]();
  where.textContent = `${current + 1} / ${pages.length} · ${s.title}${page.part === "rules" ? " · what must be true" : ""}`;
  document.getElementById("prev").disabled = current === 0;
  document.getElementById("next").disabled = current === pages.length - 1;
  index.querySelectorAll("li > button").forEach((b) => b.setAttribute("aria-current", String(Number(b.dataset.slide) === page.slide)));
  slideEl.querySelectorAll(".pager button").forEach((b) => b.addEventListener("click", () => show(pages.findIndex((p) => p.slide === page.slide && p.part === b.dataset.part))));
  slideEl.querySelectorAll(".qjump").forEach((b) => b.addEventListener("click", () => show(pages.findIndex((p) => p.slide === Number(b.dataset.slide) && p.part === "rules"))));
  history.replaceState(null, "", `#${current + 1}`);
  window.scrollTo(0, 0);
}
document.getElementById("prev").addEventListener("click", () => show(current - 1));
document.getElementById("next").addEventListener("click", () => show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
});

show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
