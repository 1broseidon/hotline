[package]
name = "hotline-browser"
description = "The server's desk browser: WebKitGTK under a private Xvfb, in a helper process `hotline serve` starts and talks to over a pipe, so the server's binary never links GTK. Linux only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "hotline-browser"
path = "src/main.rs"

# Everything is Linux's: elsewhere the binary only says it runs there. The
# web view stack is the desktop app's on Linux, at the same versions
# (`crates/hotline-app/Cargo.toml`), since this compiles that app's own
# browser files.
[target.'cfg(target_os = "linux")'.dependencies]
hotline-browser-core = { path = "../hotline-browser-core" }
hotline-contract = { path = "../hotline-contract" }
async-trait = "0.1.92"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
url = "2.5.8"
libc = "0.2"
getrandom = "0.3"
tempfile = "3"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
javascriptcore-rs = "1.1"
# Each page's display streamed and driven as the computer's is: X DAMAGE,
# MIT-SHM and XTEST, and its rectangles as PNGs.
x11rb = { version = "0.13.2", default-features = false, features = ["composite", "damage", "shm", "xtest"] }
png = "0.18.1"

# `cargo machete --with-metadata` (make check) reads only this crate's own
# files, and these two are named only in the app's browser files it compiles
# from `crates/hotline-app` (`linux.rs`: the page's picture and a script's
# answer).
[package.metadata.cargo-machete]
ignored = ["cairo-rs", "javascriptcore-rs"]
