[package]
name = "toad-computer"
description = "The MCP agent inside Toad's containerized Linux computer."
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
rmcp = { version = "=3.2.0", features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "reqwest",
] }
futures-util = "0.3.34"
base64 = "0.22.1"
# XGetImage and EWMH are the two X11 operations that cannot be delegated to
# xdotool without making capture depend on a focus-changing subprocess.
x11rb = { version = "=0.14.0", default-features = false }
# Odilia's protocol crate is the typed route to the desktop accessibility tree.
atspi = { version = "=0.30.0", default-features = false, features = ["proxies", "tokio", "zbus"] }
# Chromium is visible on the desktop while this drives its DevTools protocol.
chromiumoxide = { version = "=0.9.1", default-features = false }
# Screenshots stay raw pixels until this small, pure-Rust encoder writes PNG.
png = "=0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
