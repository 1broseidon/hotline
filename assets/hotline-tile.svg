<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Hotline">
	<!--
		The app tile: the Hotline mark, receiver and all, in the accent, on a dark rounded square that
		follows Apple's grid (the square is 82% of the canvas, its corner a little
		over a fifth of its width). Drawn here rather than left to the OS, because
		.icns art is used as-is. The colours are the window's tokens, spelled in
		sRGB because an icon renderer reads no oklch:
		top #0d1013 = oklch(17% 0.008 250), bottom #050607 = oklch(12% 0.005 250),
		mark #6bcb62 = oklch(76% 0.17 142), top-light #2d3c30 = oklch(34% 0.03 150).
		`make icons` renders every platform's set from this file.
	-->
	<defs>
		<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0d1013" />
			<stop offset="1" stop-color="#050607" />
		</linearGradient>
		<clipPath id="square">
			<rect x="92" y="92" width="840" height="840" rx="188" />
		</clipPath>
		<mask id="pupils" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
			<rect width="64" height="64" fill="#fff" />
			<rect x="14.5" y="28" width="11" height="4" rx="2" fill="#000" />
			<rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />
		</mask>
	</defs>
	<rect x="92" y="92" width="840" height="840" rx="188" fill="url(#ground)" />
	<rect x="92" y="92" width="840" height="4" fill="#2d3c30" fill-opacity="0.55" clip-path="url(#square)" />
	<!-- The mark at the same scale as before (9.6px a unit), centred on the square. -->
	<svg x="213.25" y="331.04" width="597.5" height="361.92" viewBox="0.88 10.3 62.24 37.7">
		<g fill="#6bcb62">
			<g mask="url(#pupils)">
				<rect x="4" y="30" width="56" height="18" rx="6" />
				<circle cx="20" cy="30" r="10.5" />
				<circle cx="44" cy="30" r="10.5" />
			</g>
			<path d="M1.18 25.31A19.4 19.4 0 0 1 26.98 11.9L37.02 11.9A19.4 19.4 0 0 1 62.82 25.31A3.25 3.25 0 0 1 56.52 26.88A12.9 12.9 0 0 0 44 17.1L20 17.1A12.9 12.9 0 0 0 7.48 26.88A3.25 3.25 0 0 1 1.18 25.31Z" />
		</g>
	</svg>
</svg>
