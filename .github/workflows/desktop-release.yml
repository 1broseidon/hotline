# Build the supported packages, sign them with Hotline's updater key, then publish
# one complete GitHub release. Manual runs retain signed workflow artifacts
# without creating a release or moving latest. Published versions are immutable.
# The manifest uses explicit installer targets; a missing deb cannot select an AppImage.
#
# macOS signing and notarization are optional and driven by the repository
# secrets from the Electrobun era, whose names are kept because a secret
# cannot be copied, only re-uploaded. Developer ID Application certificate
# (base64 p12), its password and identity turn signing on; the App Store
# Connect API key, issuer and .p8 turn notarization on. Without them the
# Mac job still produces a DMG that Gatekeeper will quarantine.
#
# Windows ships a per-user NSIS installer. Updater signatures are required;
# a trusted Authenticode publisher identity is a separate, deferred expense.
name: desktop-release

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["desktop-v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26's Xcode compiles SpeechAnalyzer (Swift 6.2); macos-15's
          # older Xcode would ship only the older on-device recognizer.
          - runner: macos-26
            target: aarch64-apple-darwin
            suffix: macos_aarch64
          # Intel Macs are built on Apple silicon: GitHub's Intel runner is its
          # slowest, and Rust cross-compiles to x86_64 natively.
          - runner: macos-26
            target: x86_64-apple-darwin
            suffix: macos_x86_64
            cross: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux_x86_64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: windows_x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The speech engine is linked from an archive checked against its pinned
      # hash, never fetched by the build itself (scripts/fetch-speech-engine).
      - name: Fetch the pinned speech engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"} || python scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"}

      - name: Tag must match the workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#desktop-v}"
          cargo="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          tauri="$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' crates/hotline-app/tauri.conf.json)"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$tauri" ]; then
            echo "tag desktop-v$tag, Cargo.toml $cargo, tauri.conf.json $tauri" >&2
            exit 1
          fi

      - name: A published version is immutable
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then
            echo "release $GITHUB_REF_NAME is already published — refusing to rebuild it." >&2
            echo "Bump the version and tag that; if this release is truly broken," >&2
            echo "delete the release and the tag by hand first." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A cache saved while building a tag is scoped to that tag, so no later
      # release could restore it. ci.yml's `release-cache` job builds each
      # target on every push to main under this same shared key, so a tag
      # starts from main's last release build instead of from nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      # The cache keeps the speech engine's build-script output but not the
      # library that script unpacked into target/sherpa-onnx-prebuilt, so a
      # rebuild against it finds nothing to link. Forgetting the output makes
      # the build unpack the pinned archive again.
      - name: Unpack the speech engine again
        shell: bash
        run: rm -rf target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*

      # The window's toolkit and the tray's library, found through pkg-config
      # before the deb is written (docs/development.md).
      - name: Install the Linux toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libdbus-1-dev

      - name: Install the window's dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      # Every operating system's checks, the macOS keychain round trip
      # included, ran on the pull request (ci.yml) for this same commit. The
      # release only builds.

      # Tauri reads its signing and notarization from the environment, and
      # treats a variable that is set as one that is meant: an empty value
      # would fail the build. So each is exported only when the secret exists.
      #
      # The ELECTROBUN_ prefix is the Electrobun edition's, kept because a
      # GitHub secret cannot be renamed: the value is write-only, so a new
      # name means entering the Developer ID export and the notary key again,
      # and the App Store Connect .p8 can only be downloaded once. These are
      # the Apple Developer ID certificate and the notarization API key; the
      # name says nothing about what builds them.
      - name: Expose Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.ELECTROBUN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ELECTROBUN_P12_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          API_KEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          API_ISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          API_KEY_P8: ${{ secrets.ELECTROBUN_APPLEAPIKEY_P8 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "APPLE_CERTIFICATE=$P12_BASE64" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
            if [ -n "$DEVELOPER_ID" ]; then
              echo "APPLE_SIGNING_IDENTITY=$DEVELOPER_ID" >> "$GITHUB_ENV"
            fi
          fi
          if [ -n "$API_KEY" ] && [ -n "$API_ISSUER" ] && [ -n "$API_KEY_P8" ]; then
            keypath="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
            printf '%s\n' "$API_KEY_P8" > "$keypath"
            echo "APPLE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$keypath" >> "$GITHUB_ENV"
          fi

      - name: Updater signing is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing Hotline updater signing key" >&2; exit 1; }

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/hotline-app
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          uploadUpdaterJson: false

      - name: Collect packages and signatures
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          version="$(node -p "require('./crates/hotline-app/tauri.conf.json').version")"
          bundle="target/$TARGET/release/bundle"
          mkdir -p out
          take() { cp "$1" "out/$2"; cp "$1.sig" "out/$2.sig"; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "$bundle"/dmg/*.dmg "out/hotline_${version}_${SUFFIX}.dmg"
            take "$bundle/macos/Hotline.app.tar.gz" "hotline_${version}_${SUFFIX}.app.tar.gz"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            take "$bundle"/nsis/*-setup.exe "hotline_${version}_${SUFFIX}-setup.exe"
          else
            take "$bundle"/appimage/*.AppImage "hotline_${version}_${SUFFIX}.AppImage"
            take "$bundle"/deb/*.deb "hotline_${version}_${SUFFIX}.deb"
            take "$bundle"/rpm/*.rpm "hotline_${version}_${SUFFIX}.rpm"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # The server edition: `hotline`, the desk with no window, for `hotline
  # serve` under systemd (docs/serve.md). A tarball of the binary and its
  # unit, beside the desktop packages in the same release; no updater.
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: linux_x86_64
          - runner: ubuntu-24.04-arm
            suffix: linux_aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The speech engine is linked from an archive checked against its pinned
      # hash, never fetched by the build itself (scripts/fetch-speech-engine).
      - name: Fetch the pinned speech engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"} || python scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"}
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.suffix }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The cache lacks the speech engine's unpacked library; see above.
      - name: Unpack the speech engine again
        shell: bash
        run: rm -rf target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
      # libdbus only because the core links the keyring crate; `--store
      # file` never talks to it.
      - name: Install the build's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libdbus-1-dev pkg-config
      - name: Build and pack
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          cargo build --release -p hotline-cli --locked
          name="hotline-server_${version}_${SUFFIX}"
          mkdir -p "pack/$name" out
          cp target/release/hotline packaging/hotline.service docs/serve.md LICENSE-APACHE LICENSE-MIT "pack/$name/"
          tar -C pack -czf "out/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [build, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - name: Verify manifest generation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare a draft and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then
            echo "This release is already published; refusing to replace it." >&2
            exit 1
          fi
          # The release notes written for people (docs/releases/<version>.md) go
          # to the app's updater; the GitHub Release gets them over the version's
          # CHANGELOG.md section. A tag missing either is refused here, before
          # anything is published.
          python3 scripts/release_notes.py "${GITHUB_REF_NAME#desktop-v}" --repository "$GITHUB_REPOSITORY" --app dist/app-notes.md --github dist/notes.md
          if [ "$state" = "none" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --notes-file dist/notes.md --title "$GITHUB_REF_NAME"
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file dist/notes.md
          fi
      - name: Generate the complete update manifest
        run: |
          python3 scripts/updater_manifest.py dist --version "${GITHUB_REF_NAME#desktop-v}" --repository "$GITHUB_REPOSITORY" --notes dist/app-notes.md
          cd dist
          sha256sum hotline_* hotline-server_* > checksums.txt
      - name: Publish only after all packages and the manifest are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/hotline_* dist/hotline-server_* dist/checksums.txt dist/updater-*.json dist/latest.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest --title "$GITHUB_REF_NAME"
