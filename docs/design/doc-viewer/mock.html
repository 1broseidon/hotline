<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8"><title>doc viewer mock</title>
<link rel="stylesheet" href="assets/app.css">
<style>
/* The mock's own frame. Everything inside #root uses the app's classes. */
html, body { margin: 0; background: var(--canvas); }
#root { position: relative; width: 960px; height: 600px; overflow: hidden; background: var(--canvas); color: var(--ink); }
#root.rows { width: 520px; height: auto; padding: 20px 24px 24px; }
.stack .say-row { width: 100%; }
#root .viewer { position: absolute; }
.doc-stage { margin: 16px; min-height: 0; flex: 1; overflow: hidden; border-radius: var(--radius-chip); background: var(--canvas); color: var(--ink); }
.doc-stage.pad { padding: 24px 32px; }
.doc-stage pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: var(--text-sm); line-height: 1.55; }
.page-frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.note { margin: 0 0 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
</style>
<body>
<div id="root"></div>
<script>
const icon = (d, w = 1.5) => `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const SAVE = icon('<path d="M8 2.5v8M5 7.5l3 3 3-3M3 12.5h10" />');
const FOLDER = icon('<path d="M2.5 4.75A1.25 1.25 0 0 1 3.75 3.5h2.4l1.2 1.5h4.9A1.25 1.25 0 0 1 13.5 6.25v5.5a1.25 1.25 0 0 1-1.25 1.25H3.75A1.25 1.25 0 0 1 2.5 11.75z" />');
const SOURCE = icon('<path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5" />');
const BACK = icon('<path d="M12.5 8h-9M7.25 4.25L3.5 8l3.75 3.75" />', 1.75);
const OUT = icon('<path d="M6.5 3.5h-2a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-2M9 3.5h3.5V7M12.5 3.5 7.5 8.5" />');

const keys = `<button type="button" class="line-key">${SAVE}Save</button><button type="button" class="line-key" title="Show in folder">${FOLDER}</button>`;

/** The open band over the viewer: back, who and when, the fact, the keys. */
function band(fact, extra = "") {
	return `<div class="viewer-bar"><div class="open-band"><div class="band"><div class="band-drag"></div><div class="band-row">
		<button type="button" class="control btn-icon -ml-1">${BACK}</button>
		<span class="avatar" style="width:20px;height:20px;font-size:9px;--face:oklch(62% 0.13 163)">G</span>
		<span class="open-band-name">Goldie</span><span class="instrument">· 4 min ago</span>
		<span class="min-w-0 flex-1"></span>
		<span class="instrument open-band-fact">${fact}</span>${extra}${keys}
	</div></div></div></div>`;
}
const sourceKey = (pressed) => `<button type="button" class="sheet-key" aria-pressed="${pressed}">${SOURCE}<span class="sheet-key-word">Source</span></button>`;

/** One file row, as the conversation draws it. `open` is the row's first key, or none. */
function row(mark, name, facts, open, hover = false) {
	return `<div class="file-line"${hover ? ' data-hover' : ''}><span class="file-mark" aria-hidden="true">${mark}</span><span class="file-name">${name}</span>
		<span class="file-end"><span class="file-size">${facts}</span><span class="file-keys">${open}${keys}</span></span></div>`;
}
const OPEN = `<button type="button" class="line-key">Open</button>`;
const OPEN_OUT = `<button type="button" class="line-key" title="Opens outside Hotline">${OUT}Open</button>`;

const REPORT = `<!doctype html><meta charset="utf-8"><style>
body{margin:0;font:15px/1.5 -apple-system,system-ui,sans-serif;color:#1c1d21;background:#fff}
main{max-width:760px;margin:0 auto;padding:28px 32px}
h1{font-size:24px;margin:0 0 4px}.sub{color:#6b6e78;margin:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.tile{border:1px solid #e3e4e8;border-radius:10px;padding:12px 14px}.tile b{display:block;font-size:22px}.tile span{color:#6b6e78;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;border-bottom:1px solid #e3e4e8;padding:0 4px}
.bars i{flex:1;background:#2f7d5f;border-radius:4px 4px 0 0}
.axis{display:flex;gap:10px;padding:6px 4px 0;color:#6b6e78;font-size:12px}.axis span{flex:1;text-align:center}
h2{font-size:16px;margin:24px 0 8px}
</style><main><h1>Sign-ups, week 46</h1><p class="sub">Made by Goldie from the dashboard export · 17 Nov 2026</p>
<div class="tiles"><div class="tile"><b>1,284</b><span>New sign-ups</span></div><div class="tile"><b>38%</b><span>Finished setup</span></div><div class="tile"><b>212</b><span>Paired a phone</span></div></div>
<h2>By day</h2><div class="bars"><i style="height:42%"></i><i style="height:55%"></i><i style="height:61%"></i><i style="height:48%"></i><i style="height:83%"></i><i style="height:97%"></i><i style="height:70%"></i></div>
<div class="axis"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></main>`;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

const CSV_ROWS = [["Day", "Sign-ups", "Finished setup", "Paired a phone"], ["Mon", "121", "44", "19"], ["Tue", "158", "61", "24"], ["Wed", "176", "70", "31"], ["Thu", "138", "49", "22"], ["Fri", "239", "92", "40"], ["Sat", "280", "104", "47"], ["Sun", "172", "68", "29"]];
const table = `<div class="md-table"><table><thead><tr>${CSV_ROWS[0].map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${CSV_ROWS.slice(1).map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const hex = ["00000000  50 4b 03 04 14 00 06 00 08 00 00 00 21 00 df a4", "00000010  d2 6c 5a 01 00 00 20 05 00 00 13 00 08 02 5b 43", "00000020  6f 6e 74 65 6e 74 5f 54 79 70 65 73 5d 2e 78 6d", "00000030  6c 20 a2 04 02 28 a0 00 02 00 00 00 00 00 00 00", "00000040  00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00", "00000050  00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"].join("\n");

const said = (t) => `<div class="say-row"><div class="speech said-them">${t}</div></div>`;

const SCENES = {
	// Today: a Word file opened from the conversation.
	"today-docx": () => `<div class="viewer">${band("brief.docx · 184 KB")}<div class="doc-stage" style="padding:16px"><p>Binary preview · 184 KB</p><pre>${hex}</pre></div></div>`,
	// Today: an HTML page opened from the conversation.
	"today-html": () => `<div class="viewer">${band("week-46.html · 6 KB")}<div class="doc-stage" style="padding:16px"><p>Text preview · 6 KB</p><pre>${esc(REPORT.slice(0, 900))}</pre></div></div>`,
	// Proposed: the same page, rendered, with the switch Markdown has.
	"html": () => `<div class="viewer">${band("week-46.html · 6 KB", sourceKey(false))}<div class="doc-stage"><iframe class="page-frame" sandbox srcdoc="${REPORT.replace(/"/g, "&quot;")}"></iframe></div></div>`,
	"html-source": () => `<div class="viewer">${band("week-46.html · 6 KB", sourceKey(true))}<div class="doc-stage" style="padding:16px"><pre>${esc(REPORT.slice(0, 1000))}</pre></div></div>`,
	// Proposed: a CSV as a table.
	"csv": () => `<div class="viewer">${band("week-46.csv · 7 rows × 4 columns", sourceKey(false))}<div class="doc-stage pad"><article class="md md-doc">${table}</article></div></div>`,
	// Proposed: the rows, with what each Open does.
	"rows": () => `<div class="stack">${said("Here is the week 46 pack.")}
		<section class="file-block" style="width:26rem"><div class="file-block-head"><span class="line-label">6 files · <b>2.4 MB</b></span><button type="button" class="line-key">${SAVE}Save all</button></div>
		${row("MD", "summary.md", "Created · 3 KB", OPEN)}
		${row("HTML", "week-46.html", "Created · 6 KB", OPEN)}
		${row("CSV", "week-46.csv", "Created · 1 KB", OPEN)}
		${row("PDF", "invoice-1182.pdf", "212 KB", OPEN_OUT)}
		${row("DOCX", "brief.docx", "Edited · 184 KB", OPEN_OUT, true)}
		${row("ZIP", "exports.zip", "2.0 MB", "")}
		</section></div>`,
};
const scene = new URLSearchParams(location.search).get("s") ?? "rows";
const root = document.getElementById("root");
if (scene === "rows") root.classList.add("rows");
root.innerHTML = SCENES[scene]();
</script>
</body>
</html>
