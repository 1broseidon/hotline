[package]
name = "hotline-core"
description = "Hotline's core: the log, the room, sessions and their drivers, tools, and the wire. No Tauri dependency by design."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rig.workspace = true
gethostname = "1.1"
portable-pty = "0.9"
async-trait = "0.1.92"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "process", "time", "sync"] }
chrono.workspace = true
# The host's IANA zone, passed to the computer so its clock matches the desk's.
iana-time-zone = "0.1"
rusqlite.workspace = true
cap-std = "4.0.3"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
regex = "1"
globset = "0.4.20"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
# Pinned: these features are the SDK's own "unstable", and a minor release
# may change them. They expose turn token counts, session fork capability,
# and v1 authentication methods (still feature-gated despite protocol stability).
agent-client-protocol = { version = "=2.0.0", features = ["unstable_end_turn_token_usage", "unstable_session_fork", "unstable_auth_methods"] }
# `compat` bridges ACP futures-io; `io` streams staged computer uploads.
tokio-util = { version = "0.7", features = ["compat", "io"] }
# Keep TLS explicit rather than inheriting it from Rig. Computer file uploads
# stream their staged bodies instead of buffering whole files in memory, and a
# spoken clip goes to a speech-to-text provider as a multipart form.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
url = "2.5.8"
# Agents the ACP registry ships as prebuilt archives: zip, tar.gz and tar.bz2
# are what it publishes, unpacked in Rust so no unzip or tar has to be installed.
# ZIP 9 is the first with RUSTSEC-2026-0367..0369 fixed (symlink and set-id
# extraction), and only extracting needs a decoder, so zopfli stays out.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
# Canonical paths without Windows' \\?\ prefix, for paths a person or a message will show.
dunce = "1.0.5"
# OpenRouter PKCE and xAI's device flow; inference remains on Rig.
oauth2 = { version = "5", default-features = false }
bytes = "1"
base64 = "0.22"
# GPT-Live on a ChatGPT login is a WebRTC call, as the Codex app places it:
# the desk is the peer and sends the person's audio as Opus over RTP; the
# model's speech and events come back on a sideband socket. Pinned with the
# versions Codex ships; opus builds libopus from source with cmake.
webrtc = "=0.20.3"
rtc = "=0.20.5"
opus = "=0.4.0"
# What a sent file is, from its name, when its bytes do not say.
mime_guess = "2.0.5"
http = "1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
# The pinned desk identity and encrypted v2 frames use the Noise IK pattern.
snow = "0.10"
rcgen = "0.14"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
if-addrs = "0.14"
socket2 = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tempfile = "3"
# Both halves of MCP on one version: Hotline is a client of the servers a
# teammate is granted and the server of its own teammate tools. Pinned exactly,
# because the model types are `non_exhaustive` and a minor release is free to
# grow a field the compiler then demands.
rmcp = { version = "=3.2.0", features = [
    "auth",
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "reqwest",
] }
# rmcp's server side is a tower service and nothing more, so something has to
# hold the socket. axum is what rmcp's own examples serve it with, and the
# bearer check in front of it is one layer.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
getrandom = "0.3"
hex = "0.4"
# A phone photo is 5 to 10 MB and a 12-megapixel frame; every provider has
# a ceiling below that, so an attached picture is decoded and shrunk before
# it is inlined. Only the formats a phone or a screenshot produces.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
roxmltree = "0.20"
whatlang = "0.18.0"
# The desk's own speech to text. Pinned exactly: the build downloads that
# release's prebuilt static library (onnxruntime inside, so nothing is needed
# on the host), and the C API under the wrapper moves between releases.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
# A phone's utterance is AAC in MP4; the local engine needs its samples.
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }

# `test-util`: a test whose time the code controls runs on a paused clock, so
# waiting out a 30 s token lifetime or a 10 s deadline costs nothing.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Killing a command's whole process group, which is the only way Stop reaches
# what the command itself started.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation"] }

# Points its own stdout and stderr at a file, so it runs without libtest.
[[test]]
name = "log_file"
harness = false
