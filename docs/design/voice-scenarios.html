<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice scenarios · Hotline 0.42</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f8f68'/%3E%3Cpath d='M9 13v6M13 10v12M17 12v8M21 14v4' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --font-display: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --color-paper:      oklch(17% 0.008 165);
  --color-paper-2:    oklch(21% 0.009 165);
  --color-rule:       oklch(31% 0.010 165);
  --color-ink:        oklch(95% 0.005 165);
  --color-ink-2:      oklch(80% 0.010 165);
  --color-muted:      oklch(67% 0.010 165);
  --color-accent:     oklch(76% 0.120 162);
  --color-accent-wash: oklch(30% 0.050 162);
  --color-slate:      oklch(28% 0.012 235);
  --color-warn:       oklch(78% 0.110 65);
  --color-warn-wash:  oklch(28% 0.040 65);
  --color-danger:     oklch(74% 0.130 25);
  --color-focus:      oklch(76% 0.120 162);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;

  --type-xs: 12px;
  --type-sm: 14px;
  --type-md: 16px;
  --type-lg: 20px;
  --type-xl: 25px;
  --type-2xl: 31px;
  --type-3xl: 39px;
  --leading-tight: 1.15;
  --leading-body: 1.6;
  --measure: 66ch;
  --rail: 264px;
  --page-max: 1120px;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body {
  margin: 0; background: var(--color-paper); color: var(--color-ink);
  font: 400 var(--type-md)/var(--leading-body) var(--font-body);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-style: normal; margin: 0; line-height: var(--leading-tight); overflow-wrap: anywhere; min-width: 0; }
p, li { max-width: var(--measure); }
code { font-family: var(--font-mono); font-size: 0.88em; }
.mono { font-family: var(--font-mono); font-size: var(--type-xs); letter-spacing: 0.04em; line-height: 1.4; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-sm); }

/* Frame */
.frame { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100dvh; }
.rail { border-right: 1px solid var(--color-rule); padding: var(--space-6) var(--space-4); position: sticky; top: 0; height: 100dvh; overflow-y: auto; }
.rail .title { font-weight: 700; font-size: var(--type-md); padding: 0 var(--space-3); }
.rail .sub { color: var(--color-muted); padding: 2px var(--space-3) 0; }
.rail ol { list-style: none; margin: var(--space-5) 0 0; padding: 0; }
.rail .group { color: var(--color-muted); padding: var(--space-5) var(--space-3) var(--space-1); }
.rail .group:first-child { padding-top: 0; }
.rail li > button {
  all: unset; box-sizing: border-box; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--space-2);
  width: 100%; padding: 6px var(--space-3); border-radius: var(--radius-sm); cursor: pointer;
  color: var(--color-ink-2); font-size: var(--type-sm); line-height: 1.4;
}
.rail li > button span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail li > button .n { color: var(--color-muted); font-family: var(--font-mono); font-size: var(--type-xs); padding-top: 2px; }
.rail li > button:hover { background: var(--color-paper-2); color: var(--color-ink); }
.rail li > button[aria-current="true"] { background: var(--color-accent-wash); color: var(--color-ink); }
.rail li > button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }

.stage { min-width: 0; display: flex; flex-direction: column; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-7); background: var(--color-paper); border-bottom: 1px solid var(--color-rule); }
.bar .where { flex: 1; min-width: 0; color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--color-rule); background: var(--color-paper-2); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: var(--type-sm); font-weight: 500; white-space: nowrap; min-height: 34px; }
.btn:hover:not(:disabled) { border-color: var(--color-muted); }
.btn:disabled { color: var(--color-muted); cursor: default; }
.slide { width: 100%; max-width: var(--page-max); padding: var(--space-8) var(--space-7) var(--space-8); }

/* Slide type */
.eyebrow { color: var(--color-accent); margin-bottom: var(--space-3); }
.slide h2 { font-size: var(--type-2xl); font-weight: 700; letter-spacing: -0.01em; max-width: 26ch; }
.lede { color: var(--color-ink-2); font-size: var(--type-lg); line-height: 1.5; margin: var(--space-4) 0 0; max-width: 58ch; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-5); }
.chip { font-family: var(--font-mono); font-size: var(--type-xs); letter-spacing: 0.04em; color: var(--color-ink-2); background: var(--color-paper-2); border: 1px solid var(--color-rule); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.label { color: var(--color-muted); margin: 0 0 var(--space-4); text-transform: none; }
.pager { display: flex; gap: var(--space-2); margin-top: var(--space-6); }
.pager button { all: unset; cursor: pointer; font-size: var(--type-sm); color: var(--color-muted); padding-bottom: 4px; border-bottom: 2px solid transparent; }
.pager button[aria-current="true"] { color: var(--color-ink); border-bottom-color: var(--color-accent); font-weight: 500; }
.pager button + button { margin-left: var(--space-4); }

/* The call */
.call { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--space-7); margin-top: var(--space-6); align-items: start; }
.tape { display: flex; flex-direction: column; gap: var(--space-3); }
.line { display: flex; flex-direction: column; max-width: 82%; }
.line .who { color: var(--color-muted); margin-bottom: 4px; }
.line .say { padding: 10px 14px; border-radius: 14px; font-size: var(--type-md); line-height: 1.5; }
.line.you { align-self: flex-end; align-items: flex-end; }
.line.you .say { background: var(--color-slate); border-bottom-right-radius: 4px; }
.line.mate .say { background: var(--color-paper); border: 1px solid var(--color-rule); border-bottom-left-radius: 4px; }
.line.cut .say { border-style: dashed; color: var(--color-ink-2); }
.line.cut .say::after { content: " —"; }
.machine { display: flex; gap: var(--space-2); align-items: baseline; color: var(--color-muted); padding: 2px 0 2px var(--space-1); }
.machine::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); transform: translateY(-1px); }
.machine.warn::before { background: var(--color-warn); }
.machine b { color: var(--color-ink-2); font-weight: 500; }
.gapnote { color: var(--color-muted); text-align: center; padding: var(--space-1) 0; }
.after { background: var(--color-paper-2); border-radius: var(--radius-lg); padding: var(--space-5); }
.after .empty { color: var(--color-muted); margin: 0; font-size: var(--type-sm); }
.post { background: var(--color-paper); border: 1px solid var(--color-rule); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: var(--type-sm); line-height: 1.55; }
.post + .post { margin-top: var(--space-3); }
.post .from { color: var(--color-muted); margin-bottom: 6px; }
.post .title { font-weight: 700; margin-bottom: 2px; }
.post ul { margin: 0; padding-left: 18px; }
.post li + li { margin-top: 4px; }
.post .open { color: var(--color-accent); margin-top: var(--space-3); }
.mocknote { color: var(--color-muted); margin-top: var(--space-5); }

/* The rules for a scenario */
.musts { counter-reset: must; list-style: none; padding: 0; margin: var(--space-6) 0 0; display: grid; gap: var(--space-4); }
.musts li { counter-increment: must; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--space-3); font-size: var(--type-lg); line-height: 1.45; max-width: 64ch; }
.musts li::before { content: counter(must, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--type-xs); color: var(--color-accent); padding-top: 7px; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); margin-top: var(--space-7); }
.note { border-radius: var(--radius-lg); padding: var(--space-5); font-size: var(--type-md); }
.note h3 { font-size: var(--type-sm); font-weight: 700; margin-bottom: var(--space-3); }
.note ul { margin: 0; padding-left: 18px; }
.note li + li { margin-top: var(--space-2); }
.note.today { background: var(--color-warn-wash); }
.note.today h3 { color: var(--color-warn); }
.note.decide { border: 1px solid var(--color-rule); }
.note.decide h3 { color: var(--color-accent); }

/* Overview slides */
.cover { padding-top: var(--space-7); }
.cover h2 { font-size: var(--type-3xl); max-width: 22ch; }
.rulebig { margin-top: var(--space-7); padding: var(--space-5) var(--space-6); border: 1px solid var(--color-rule); border-radius: var(--radius-lg); font-size: var(--type-lg); line-height: 1.5; max-width: 60ch; }
.rulebig .mono { display: block; color: var(--color-accent); margin-bottom: var(--space-2); }
.hint { color: var(--color-muted); margin-top: var(--space-6); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6) var(--space-7); margin-top: var(--space-6); }
.grid2 > div { min-width: 0; }
.grid2 h3 { font-size: var(--type-lg); font-weight: 700; margin-bottom: var(--space-3); }
.grid2 p { color: var(--color-ink-2); margin: 0 0 var(--space-3); }
.grid2 ul { margin: 0; padding-left: 18px; }
.grid2 li + li { margin-top: var(--space-2); }
.grid2 .where { color: var(--color-muted); margin-top: var(--space-3); }
.say-no { color: var(--color-danger); }
.journey { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6) var(--space-6); margin-top: var(--space-6); counter-reset: step; }
.journey > div { border-top: 2px solid var(--color-rule); padding-top: var(--space-4); min-width: 0; }
.journey > div:first-child { border-top-color: var(--color-accent); }
.journey .mono { color: var(--color-accent); }
.journey h3 { font-size: var(--type-xl); font-weight: 700; margin: var(--space-2) 0 var(--space-3); }
.journey ul { margin: 0; padding-left: 18px; color: var(--color-ink-2); }
.journey li + li { margin-top: 4px; }
.tablewrap { overflow-x: auto; margin-top: var(--space-6); }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: var(--type-sm); }
th, td { text-align: left; vertical-align: top; padding: var(--space-3) var(--space-4) var(--space-3) 0; border-bottom: 1px solid var(--color-rule); }
th { font-family: var(--font-mono); font-size: var(--type-xs); letter-spacing: 0.04em; font-weight: 500; color: var(--color-muted); }
td.k { font-weight: 700; white-space: nowrap; }
.qjump { all: unset; cursor: pointer; color: var(--color-accent); }
.qjump:hover { text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 1080px) {
  .call { grid-template-columns: minmax(0, 1fr); gap: var(--space-6); }
  .journey { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .bar { padding: var(--space-3) var(--space-4); }
  .slide { padding: var(--space-6) var(--space-4) var(--space-7); }
  .notes, .grid2, .journey { grid-template-columns: minmax(0, 1fr); }
  .slide h2 { font-size: var(--type-xl); }
  .cover h2 { font-size: var(--type-2xl); }
  .lede, .musts li, .rulebig { font-size: var(--type-md); }
  .line { max-width: 92%; }
}
</style>
</head>
<body>
<div class="frame">
  <nav class="rail" aria-label="Slides">
    <div class="title">Voice scenarios</div>
    <div class="sub mono">Hotline 0.42 · 2026-10-20</div>
    <ol id="index"></ol>
  </nav>
  <div class="stage">
    <div class="bar">
      <span class="where mono" id="where" aria-live="polite"></span>
      <button class="btn" type="button" id="prev">Back</button>
      <button class="btn" type="button" id="next">Next</button>
    </div>
    <main class="slide" id="slide" tabindex="-1"></main>
  </div>
</div>
<script>
const S = (o) => ({ kind: "scenario", ...o });
const you = (t) => ({ t: "you", s: t });
const mate = (t, who) => ({ t: "mate", s: t, who });
const cut = (t, who) => ({ t: "cut", s: t, who });
const run = (label, s, warn) => ({ t: "machine", label, s, warn });
const post = (from, s) => ({ t: "post", from, s });
// Something the call made, written to stand on its own in the chat.
const art = (from, title, s) => ({ t: "art", from, title, s });
// The call's closing note: what was discussed, decided and made, and the way into the call.
const note = (who, items) => ({ t: "note", who, items });
const pause = (s) => ({ t: "gap", s });

const slides = [
  { kind: "cover", group: "Start", title: "Voice scenarios" },
  { kind: "points", group: "Start", title: "Your three points" },
  { kind: "journey", group: "Start", title: "The journey" },
  { kind: "types", group: "Start", title: "Kinds of conversation" },

  S({ group: "Talking", title: "A quick question on the go",
    lede: "The commonest call: one question, one answer, gone. The live voice answers it from a lookup, at the speed of its own thinking.",
    setting: ["Phone", "Walking", "Live voice", "Goldie (Hotline Agent)"],
    tape: [
      you("Did Rex finish the release notes?"),
      run("lookup", "search_thread · list_chapters on Rex's work thread"),
      mate("Not yet. He's on the last section, the Copilot fixes, and asked nothing of you.", "Goldie"),
      you("Okay, thanks."),
      mate("Talk soon.", "Goldie"),
      pause("hang up"),
      run("after 30 s", "closing note posted, thread parks"),
    ],
    chat: [note("Call with Goldie · 1 min", ["Rex's 0.42 release notes aren't finished; he's on the Copilot section and needs nothing from you."])],
    must: [
      "The answer comes from a lookup. A question about state, code or results is never answered from memory.",
      "No pointer to the chat: nothing here is in it.",
      "The first words follow the question at once; a lookup that takes a moment is covered by a few words naming it (\"Let me look\"), never by silence.",
      "Small talk stays on the call's own thread. The chat gets one closing note, not the exchange.",
    ],
    gap: ["The front sometimes answers state it hasn't looked up (task-204)."],
    ask: ["Is a closing note worth posting for a call this short, or should a call under a few turns with no work post nothing?"],
  }),

  S({ group: "Talking", title: "Where are we on it?",
    lede: "A status check-in. The answer is short when spoken, and a list goes to the chat only when it really is a list.",
    setting: ["Desk window", "Live voice", "Pork Chop (Claude Code)"],
    tape: [
      you("Where are we on 0.42?"),
      run("lookup", "the board: epic-22 and its children; CI on release/0.42.0"),
      mate("Everything on the Rig upgrade has landed and CI is green. The last thing is your Grok Voice call, and then it's ready to cut.", "Pork Chop"),
      you("What did QA find today?"),
      mate("Three bugs, all fixed: Sonnet stopping after a tool call, Codex failing on every turn, and the model picker making you switch off every model one by one.", "Pork Chop"),
      you("Good. Anything blocked?"),
      mate("No.", "Pork Chop"),
    ],
    chat: [note("Call with Pork Chop · 2 min", ["0.42 is ready to cut once you've made the Grok Voice check.", "Today's QA found three bugs, all fixed. Nothing is blocked."])],
    must: [
      "Three items are said, not posted. A list goes to the chat only when it is longer than a few items, or holds links or code.",
      "A one-word answer is allowed when one word is the answer.",
      "Follow-ups stay on the call; nothing is re-asked of the person.",
    ],
    gap: ["\"Details are in the chat\" comes out nearly every turn (task-207), even when the chat holds nothing more."],
  }),

  S({ group: "Work", title: "Asking for real work",
    lede: "Anything that writes or changes something goes to a clone of the teammate on its own model and harness. The call goes on; the result comes back into the call, and what it made goes to the chat.",
    setting: ["Desk window", "Live voice", "Pork Chop (Claude Code)"],
    tape: [
      you("Write up the release notes for 0.42."),
      mate("Let me write those up.", "Pork Chop"),
      run("work", "a clone of Pork Chop on Claude Code, focused on the notes, on the call's thread"),
      you("While that runs, did the phone build go through?"),
      run("lookup", "EAS build list"),
      mate("Yes, build 35 is on TestFlight.", "Pork Chop"),
      pause("the clone finishes"),
      mate("The notes are written: the Rig upgrade, the Copilot fixes and the model picker. They're in the chat.", "Pork Chop"),
      run("post_to_chat", "docs/releases/0.42.0.md, from the call"),
    ],
    chat: [art("From the call", "Release notes for 0.42.0", "The Rig 0.45 upgrade, the two Copilot fixes and the model picker. docs/releases/0.42.0.md is attached."), note("Call with Pork Chop · 4 min", ["You asked for the 0.42.0 release notes; they're written, above.", "The iOS build went through and is on TestFlight."])],
    must: [
      "The voice is the teammate: its name, its manner, its recent chat and the call so far. It says what it will do in its own words, often with no announcement at all (\"I'll keep it to a page\").",
      "Said as the teammate's own action, in the first person. Never \"handing that off\", \"passing that on\", \"I'll get someone on it\".",
      "The acknowledgement names what was asked, in a few words, and is not one the call has already used.",
      "The person can keep talking while the work runs; lookups still answer.",
      "The home agent is never interrupted. The work is done by the teammate's own model and harness, as if typed.",
      "The pointer to the chat is said once, because there is a file in it.",
    ],
    gap: [
      "Today the desk call narrates the hand-off and the live front sends the work into the DM through send_to_teammate, interrupting the home agent.",
    ],
  }),

  S({ group: "Work", title: "Changing your mind mid-work",
    lede: "The person steers work already running, the way a second typed line steers a turn in flight.",
    setting: ["Desk window", "Live voice", "continues the last slide"],
    tape: [
      you("Write up the release notes for 0.42."),
      mate("Let me write those up.", "Pork Chop"),
      run("work", "clone started"),
      you("Actually, keep it under a page and lead with the Copilot fixes."),
      run("work", "the line goes to the running clone's thread"),
      mate("Under a page, Copilot first.", "Pork Chop"),
      pause("the clone finishes"),
      mate("Done, one page, Copilot fixes first. It's in the chat.", "Pork Chop"),
    ],
    chat: [art("From the call", "Release notes for 0.42.0, one page", "Rewritten to fit one page, leading with the Copilot fixes, as you asked on the call. The file is attached.")],
    must: [
      "A change to running work steers it; it does not start a second clone.",
      "The confirmation repeats back what changed, in a few words, so the person knows it was understood.",
    ],
    ask: [
      "Does the front get a way to steer a clone (a line onto its thread), or does asking the work tool again with the same task count as steering?",
      "Can the person stop work by voice (\"never mind, drop it\")? I'd say yes, and it should say what was left unfinished.",
    ],
  }),

  S({ group: "Talking", title: "Thinking out loud",
    lede: "A long back-and-forth with no tools at all. It should sound like a conversation, not a series of reports.",
    setting: ["Phone", "Driving", "Live voice", "Goldie"],
    tape: [
      you("I'm trying to work out what to call the clone when it runs on a call. Work thread? Arm?"),
      mate("The ADR calls the whole family arms. From your side it's just the teammate doing it, so maybe it needs no name on the call at all.", "Goldie"),
      you("Right, but on the card?"),
      mate("The card could name the task, not the mechanism: \"Writing the release notes\".", "Goldie"),
      you("I like that. What if two things are running?"),
      mate("Two rows, each with its task and a dot that breathes while it runs.", "Goldie"),
      you("Okay, write that down as a proposal."),
      mate("Writing it up.", "Goldie"),
      run("work", "clone: write the proposal from this conversation"),
    ],
    chat: [art("From the call", "Proposal: name a call's work by its task", "From our call about naming: the call card names the task (\"Writing the release notes\"), not the mechanism, and two tasks show as two rows. The proposal is attached."), note("Call with Goldie · 6 min", ["We settled that a call's running work is named by its task on the card, with one row per task.", "The proposal is written, above."])],
    must: [
      "No pointer to the chat on a conversational turn, ever.",
      "A conversational turn's written version is the spoken words; there is no second answer to invent.",
      "Lengths follow the talk: a short reply to a short line.",
      "When it ends in \"write that down\", it becomes the work scenario, carrying the whole conversation as its brief.",
    ],
    gap: ["Every turn gets the same two-version instruction with its 40-word cap and chat pointer, whatever kind of turn it is (task-207)."],
  }),

  S({ group: "Talking", title: "Give me the rundown, I have time",
    lede: "The person asks for length. The usual short-reply rule relaxes, and the teammate checks in rather than reading a wall.",
    setting: ["Phone", "Commute", "Live voice", "Pork Chop"],
    tape: [
      you("Give me the rundown on today. I've got ten minutes."),
      run("lookup", "today's chapters, board moves, CI runs"),

// Scenarios grouped in the index's order; the order within a group stays.
const ORDER = ["Start", "Talking", "Work", "Desk", "After", "Trouble", "Rules"];
slides.sort((a, b) => ORDER.indexOf(a.group) - ORDER.indexOf(b.group));


const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = (items) => `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;

/* A scenario is two pages: the call, then what must be true of it. */
const pages = [];
let scenarioNo = 0;
slides.forEach((s, i) => {
  if (s.kind === "scenario") {
    s.no = ++scenarioNo;
    pages.push({ slide: i, part: "call" }, { slide: i, part: "rules" });
  } else {
    pages.push({ slide: i, part: null });
  }
});

function tapeHtml(tape) {
  return tape.map((l) => {
    if (l.t === "you") return `<div class="line you"><span class="who mono">You</span><div class="say">${esc(l.s)}</div></div>`;
    if (l.t === "mate" || l.t === "cut") return `<div class="line mate${l.t === "cut" ? " cut" : ""}"><span class="who mono">${esc(l.who)}${l.t === "cut" ? " · cut off" : ""}</span><div class="say">${esc(l.s)}</div></div>`;
    if (l.t === "machine") return `<div class="machine mono${l.warn ? " warn" : ""}"><span><b>${esc(l.label)}</b> · ${esc(l.s)}</span></div>`;
    if (l.t === "gap") return `<div class="gapnote mono">${esc(l.s)}</div>`;
    return "";
  }).join("");
}

function chatHtml(p) {
  if (p.t === "note") return `<div class="post"><div class="from mono">${esc(p.who)} · closing note</div><ul>${p.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul><div class="open mono">Open the call →</div></div>`;
  if (p.t === "art") return `<div class="post"><div class="from mono">${esc(p.from)}</div><div class="title">${esc(p.title)}</div>${esc(p.s)}</div>`;
  return `<div class="post"><div class="from mono">${esc(p.from)}</div>${esc(p.s)}</div>`;
}

function scenarioHead(s, part) {
  return `
    <div class="eyebrow mono">Scenario ${s.no} · ${esc(s.group)}</div>
    <h2>${esc(s.title)}</h2>
    <p class="lede">${esc(s.lede)}</p>
    <div class="chips">${s.setting.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="pager" role="tablist" aria-label="Parts of this scenario">
      <button type="button" data-part="call" aria-current="${part === "call"}">${esc(s.tapeTitle ?? "The call")}</button>
      <button type="button" data-part="rules" aria-current="${part === "rules"}">What must be true</button>
    </div>`;
}

function scenarioCall(s) {
  const after = s.chat.length ? s.chat.map(chatHtml).join("") : `<p class="empty">Nothing. The call's own thread holds it.</p>`;
  return `${scenarioHead(s, "call")}
    <div class="call">
      <div>
        <div class="tape">${tapeHtml(s.tape)}</div>
        <p class="mocknote mono">The lines are illustrative, written to show the flow.</p>
      </div>
      <aside class="after" aria-label="In the chat afterwards">
        <p class="label mono">In the chat afterwards</p>
        ${after}
      </aside>
    </div>`;
}

function scenarioRules(s) {
  const notes = [
    s.gap ? `<div class="note today"><h3>Today</h3>${list(s.gap)}</div>` : "",
    s.ask ? `<div class="note decide"><h3>For you to decide</h3>${list(s.ask)}</div>` : "",
  ].join("");
  return `${scenarioHead(s, "rules")}
    <ol class="musts">${s.must.map((m) => `<li><span>${esc(m)}</span></li>`).join("")}</ol>
    ${notes ? `<div class="notes">${notes}</div>` : ""}`;
}

        <li>Never: <span class="say-no">"handing that off"</span>, <span class="say-no">"passing that on"</span>, <span class="say-no">"let me check that for you"</span>.</li>
      </ul></div>
      <div><h3>The chat</h3><ul>
        <li>The pointer to the chat is said only when the chat holds something speech can't carry: a file, code, a table, links, a long list.</li>
        <li>At most once every few turns, never on a conversational turn.</li>
        <li>Small talk stays on the call's thread. The chat gets results, records and one closing note.</li>
        <li>Every post stands alone: it names its subject and never leans on the call.</li>
        <li>The closing note summarises what was discussed, decided and made, and opens the call. It is never a transcript.</li>
      </ul></div>
      <div><h3>Silence and length</h3><ul>
        <li>Never dead air: a few words naming the lookup, or one soft sound when work goes out and nothing was said.</li>
        <li>Short by default; long when asked, in parts, with check-ins.</li>
        <li>A one-word answer when one word is the answer.</li>
      </ul></div>
      <div><h3>Truth and reach</h3><ul>
        <li>State, code and results are looked up, never guessed.</li>
        <li>Voice narrows what the person hears, never what the teammate can reach: the call's lease is the thread's.</li>
        <li>Nothing is sent, deleted or paid for without the person saying so; credentials never by voice.</li>
      </ul></div>
    </div>`,

  removes: () => `
    <div class="eyebrow mono">Rules</div>
    <h2>What the refactor removes</h2>
    <p class="lede">From ADR 0008 §5. Each of these is behind one or more of today's gaps in the scenarios.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Goes</th><th>Replaced by</th><th>Scenario it fixes</th></tr></thead>
      <tbody>
        <tr><td class="k"><code>send_to_teammate</code> into the DM, the relay</td><td>One first-person work tool running a clone on the call's thread</td><td>Asking for real work</td></tr>
        <tr><td class="k">The call assistant's delegation loop</td><td>The same work tool, for GPT-Live too</td><td>Asking for real work</td></tr>
        <tr><td class="k">The dispatcher's desk role and its command table</td><td>A call thread on the team lead</td><td>Calling the desk</td></tr>
        <tr><td class="k">Five-minute summaries and the mechanical digest</td><td>Posts as things happen, and one closing note</td><td>Hanging up while work runs</td></tr>
        <tr><td class="k">The follow-up of an unanswered question at hang-up</td><td>The turn finishes and its reply is posted</td><td>Hanging up while work runs</td></tr>
        <tr><td class="k">One spoken instruction for every turn</td><td>An instruction that knows the kind of turn and what was already said</td><td>Thinking out loud, Status</td></tr>
        <tr><td class="k">Example acknowledgement phrases in the prompt</td><td>A description of a good one, and the last few fed back</td><td>Every scenario</td></tr>
      </tbody>
    </table></div>`,

  questions: () => {
    const qs = slides.map((s, i) => [s, i]).filter(([s]) => s.ask);
    return `
    <div class="eyebrow mono">Rules</div>
    <h2>Questions for you</h2>
    <p class="lede">Collected from the scenarios. Each answer becomes a line in a task's description before the slices are dispatched.</p>
    <div class="grid2">${qs.map(([s, i]) => `<div><h3><button type="button" class="qjump" data-slide="${i}">${esc(s.title)}</button></h3>${list(s.ask)}</div>`).join("")}</div>`;
  },
};



const index = document.getElementById("index");
const slideEl = document.getElementById("slide");
const where = document.getElementById("where");
let current = 0;

let lastGroup = null;
slides.forEach((s, i) => {
  if (s.group !== lastGroup) {
    const g = document.createElement("li");
    g.className = "group mono";
    g.textContent = s.group;
    index.appendChild(g);
    lastGroup = s.group;
  }
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.slide = i;
  b.innerHTML = `<span class="n">${s.no ?? "·"}</span><span>${esc(s.title)}</span>`;
  b.addEventListener("click", () => show(pages.findIndex((p) => p.slide === i)));
  li.appendChild(b);
  index.appendChild(li);
});

function show(next) {
  current = Math.max(0, Math.min(pages.length - 1, next));
  const page = pages[current];
  const s = slides[page.slide];
  slideEl.innerHTML = page.part === "call" ? scenarioCall(s) : page.part === "rules" ? scenarioRules(s) : views[s.kind]();
  where.textContent = `${current + 1} / ${pages.length} · ${s.title}${page.part === "rules" ? " · what must be true" : ""}`;
  document.getElementById("prev").disabled = current === 0;
  document.getElementById("next").disabled = current === pages.length - 1;
  index.querySelectorAll("li > button").forEach((b) => b.setAttribute("aria-current", String(Number(b.dataset.slide) === page.slide)));
  slideEl.querySelectorAll(".pager button").forEach((b) => b.addEventListener("click", () => show(pages.findIndex((p) => p.slide === page.slide && p.part === b.dataset.part))));
  slideEl.querySelectorAll(".qjump").forEach((b) => b.addEventListener("click", () => show(pages.findIndex((p) => p.slide === Number(b.dataset.slide) && p.part !== "call"))));
  history.replaceState(null, "", `#${current + 1}`);
  window.scrollTo(0, 0);
}
document.getElementById("prev").addEventListener("click", () => show(current - 1));
document.getElementById("next").addEventListener("click", () => show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
});

show((parseInt(location.hash.slice(1), 10) || 1) - 1);

</script>
</body>
</html>
