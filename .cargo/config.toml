# Where ts-rs writes the TypeScript it generates from `hotline_core::contract`,
# and how it spells a 64-bit integer.
#
# The window reads `ui/src/generated`. And ts-rs spells `i64` as `bigint` by
# default, which is a type `JSON.parse` never produces — every number on this
# wire arrives as a JavaScript `number`, so that is what the generated types
# have to say.
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/generated", relative = true }
TS_RS_LARGE_INT = "number"
# sherpa-onnx's build links the archive it finds here and never downloads
# one itself; scripts/fetch-speech-engine puts it here after checking its hash.
SHERPA_ONNX_ARCHIVE_DIR = { value = ".speech-engine", relative = true }

# Link the C runtime statically on Windows. The MSVC default is the DLL
# (VCRUNTIME140.dll, VCRUNTIME140_1.dll), which a clean Windows does not have:
# without this the app dies at launch with "VCRUNTIME140_1.dll was not found",
# before it can say anything itself.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
