<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1.8 64 64" role="img" aria-label="Hotline">
	<!--
		The Hotline mark.

		A toad's eyes sit on top of its head and break the outline, and its pupil is a
		horizontal slit. Across the eyes rests a telephone receiver: the eyes are where a
		desk phone's earpiece and mouthpiece sit in the cradle, so the handset reads as
		the operator's headset and as a receiver that lifts off its base. Everything else
		is a flat body cut off by the waterline it is sitting in.

		One colour, so it works on any background. The pupils are punched through and the
		receiver is cut from the eyes by a gap, so there is never a second fill to keep in
		sync. The receiver's geometry lives in ui/src/ui/receiver.ts; this path is
		receiverPath(RECEIVER) written out. At 24px and under use hotline-mark-small.svg,
		whose wider cut survives as a pixel.
	-->
	<mask id="hotline-pupils" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
		<rect width="64" height="64" fill="#fff" />
		<rect x="14.5" y="28" width="11" height="4" rx="2" fill="#000" />
		<rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />
	</mask>
	<g fill="currentColor">
		<g mask="url(#hotline-pupils)">
			<rect x="4" y="30" width="56" height="18" rx="6" />
			<circle cx="20" cy="30" r="10.5" />
			<circle cx="44" cy="30" r="10.5" />
		</g>
		<path d="M2.96 27A17.3 17.3 0 0 1 27.05 14.2L36.95 14.2A17.3 17.3 0 0 1 61.04 27A2.3 2.3 0 0 1 56.51 27.79A12.7 12.7 0 0 0 44 17.3L20 17.3A12.7 12.7 0 0 0 7.49 27.79A2.3 2.3 0 0 1 2.96 27Z" />
	</g>
</svg>
