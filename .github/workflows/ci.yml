# The checks a release runs, on every pull request, before the tag.
#
# A push to main runs them once more and saves the caches every pull request
# and release restores. A pull request's own cache is scoped to that pull
# request and useful to nothing after it, so only main saves: otherwise each
# pull request's 1 GB caches fill the repository's 10 GB and evict the ones
# that matter.
#
# Pull requests from this repository's own branches run on grizzly, the
# self-hosted Linux box and its Windows VM, where toolchains and build output
# stay warm between jobs. A pull request from a fork never reaches those
# machines: it runs on GitHub's runners, like everything did before.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            hosted: ubuntu-24.04
          - os: windows
            hosted: windows-2025
    # Ours (a branch here, or a manual run) goes to grizzly; a fork's goes to
    # GitHub. The repo variable CI_RUNNERS=hosted sends everything to GitHub,
    # for when grizzly is busy or down.
    runs-on: ${{ vars.CI_RUNNERS != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","grizzly-{0}"]', matrix.os)) || matrix.hosted }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The speech engine is linked from an archive checked against its pinned
      # hash, never fetched by the build itself (scripts/fetch-speech-engine).
      - name: Fetch the pinned speech engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"} || python scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # grizzly keeps target/ on its own disk; only GitHub's runners need the cache.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The cache keeps the speech engine's build-script output and its
      # target/sherpa-onnx-prebuilt folder, but not the library unpacked into
      # it, and the script only unpacks into a folder that is not there.
      # Forgetting both makes the build unpack the pinned archive again.
      - name: Unpack the speech engine again
        if: runner.environment == 'github-hosted'
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*

      # grizzly's Linux image has these baked in.
      - name: Install the Linux toolkit
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libdbus-1-dev

      - name: Install the window's dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Check the core and window on this operating system
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          bun run --cwd ui typecheck
          python3 -m unittest discover -s scripts -p 'test_updater_manifest.py' || python -m unittest discover -s scripts -p 'test_updater_manifest.py'

      # The release no longer runs the tests, so the round trip through
      # Windows' Credential Manager, which needs a real Windows session, runs here.
      - name: Verify native desktop credential storage
        if: runner.os == 'Windows'
        run: cargo test --workspace native_store_roundtrip --locked -- --ignored

  # macOS-only code (the keychain, notifications, the Finder PATH test) is
  # compiled nowhere else before a tag, and the release only builds: a slip
  # there would cost a whole release run (0.28.0's did). So its clippy, its
  # tests and the keychain round trip all run here.
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The speech engine is linked from an archive checked against its pinned
      # hash, never fetched by the build itself (scripts/fetch-speech-engine).
      - name: Fetch the pinned speech engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"} || python scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The cache lacks the speech engine's unpacked library; see above.
      - name: Unpack the speech engine again
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*

      - name: Compile the macOS code and its tests
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test on macOS
        run: cargo test --workspace --locked

      # The round trip through the login keychain, which needs a real macOS
      # session.
      - name: Verify native desktop credential storage
        run: cargo test --workspace native_store_roundtrip --locked -- --ignored

  # On a push to main (or a manual run), the release's own build of each target, unsigned and
  # unbundled, saved under the key desktop-release.yml restores. A tag then
  # compiles only what changed since main's last push, not every dependency
  # from nothing. The repository is public, so these minutes are free.
  release-cache:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The speech engine is linked from an archive checked against its pinned
      # hash, never fetched by the build itself (scripts/fetch-speech-engine).
      - name: Fetch the pinned speech engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"} || python scripts/fetch-speech-engine ${TARGET:+--target "$TARGET"}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The cache lacks the speech engine's unpacked library; see above.
      - name: Unpack the speech engine again
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*

      - name: Install the Linux toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libdbus-1-dev

      - name: Install the window's dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      # The same `tauri build` tauri-action runs, so the same features and
      # profile, without the bundle and its signing.
      - name: Build the release
        working-directory: crates/hotline-app
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --no-bundle
