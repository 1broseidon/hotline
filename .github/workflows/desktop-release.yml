# Build the supported packages, sign them with Hotline's updater key, then publish
# one complete GitHub release. Manual runs retain signed workflow artifacts
# without creating a release or moving latest. Published versions are immutable.
# The manifest uses explicit installer targets; a missing deb cannot select an AppImage.
#
# macOS signing and notarization are optional and driven by the repository
# secrets from the Electrobun era, whose names are kept because a secret
# cannot be copied, only re-uploaded. Developer ID Application certificate
# (base64 p12), its password and identity turn signing on; the App Store
# Connect API key, issuer and .p8 turn notarization on. Without them the
# Mac job still produces a DMG that Gatekeeper will quarantine.
#
# Windows ships a per-user NSIS installer. Updater signatures are required;
# a trusted Authenticode publisher identity is a separate, deferred expense.
name: desktop-release

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["desktop-v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: macos_aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos_x86_64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux_x86_64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: windows_x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#desktop-v}"
          cargo="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          tauri="$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' crates/hotline-app/tauri.conf.json)"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$tauri" ]; then
            echo "tag desktop-v$tag, Cargo.toml $cargo, tauri.conf.json $tauri" >&2
            exit 1
          fi

      - name: A published version is immutable
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then
            echo "release $GITHUB_REF_NAME is already published — refusing to rebuild it." >&2
            echo "Bump the version and tag that; if this release is truly broken," >&2
            echo "delete the release and the tag by hand first." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # The window's toolkit and the tray's library, found through pkg-config
      # before the deb is written (docs/development.md).
      - name: Install the Linux toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libdbus-1-dev

      - name: Install the window's dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Check the core and window on this operating system
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          bun run --cwd ui typecheck
          python -m unittest discover -s scripts -p 'test_updater_manifest.py'

      - name: Verify native desktop credential storage
        if: runner.os != 'Linux'
        run: cargo test --workspace native_store_roundtrip --locked -- --ignored

      # Tauri reads its signing and notarization from the environment, and
      # treats a variable that is set as one that is meant: an empty value
      # would fail the build. So each is exported only when the secret exists.
      - name: Expose Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.ELECTROBUN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ELECTROBUN_P12_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          API_KEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          API_ISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          API_KEY_P8: ${{ secrets.ELECTROBUN_APPLEAPIKEY_P8 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "APPLE_CERTIFICATE=$P12_BASE64" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
            if [ -n "$DEVELOPER_ID" ]; then
              echo "APPLE_SIGNING_IDENTITY=$DEVELOPER_ID" >> "$GITHUB_ENV"
            fi
          fi
          if [ -n "$API_KEY" ] && [ -n "$API_ISSUER" ] && [ -n "$API_KEY_P8" ]; then
            keypath="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
            printf '%s\n' "$API_KEY_P8" > "$keypath"
            echo "APPLE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$keypath" >> "$GITHUB_ENV"
          fi

      - name: Updater signing is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing Hotline updater signing key" >&2; exit 1; }

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/hotline-app
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          uploadUpdaterJson: false

      - name: Collect packages and signatures
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          version="$(node -p "require('./crates/hotline-app/tauri.conf.json').version")"
          bundle="target/$TARGET/release/bundle"
          mkdir -p out
          take() { cp "$1" "out/$2"; cp "$1.sig" "out/$2.sig"; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "$bundle"/dmg/*.dmg "out/hotline_${version}_${SUFFIX}.dmg"
            take "$bundle/macos/Hotline.app.tar.gz" "hotline_${version}_${SUFFIX}.app.tar.gz"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            take "$bundle"/nsis/*-setup.exe "hotline_${version}_${SUFFIX}-setup.exe"
          else
            take "$bundle"/appimage/*.AppImage "hotline_${version}_${SUFFIX}.AppImage"
            take "$bundle"/deb/*.deb "hotline_${version}_${SUFFIX}.deb"
            take "$bundle"/rpm/*.rpm "hotline_${version}_${SUFFIX}.rpm"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Verify manifest generation
        run: python3 -m unittest discover -s scripts -p 'test_updater_manifest.py'
      - name: Prepare a draft and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then
            echo "This release is already published; refusing to replace it." >&2
            exit 1
          fi
          if [ "$state" = "none" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > dist/notes.md
      - name: Generate the complete update manifest
        run: |
          python3 scripts/updater_manifest.py dist --version "${GITHUB_REF_NAME#desktop-v}" --repository "$GITHUB_REPOSITORY" --notes dist/notes.md
          cd dist
          sha256sum hotline_* > checksums.txt
      - name: Publish only after all packages and the manifest are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/hotline_* dist/checksums.txt dist/updater-*.json dist/latest.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest --title "$GITHUB_REF_NAME"
