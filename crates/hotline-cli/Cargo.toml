[package]
name = "hotline-cli"
description = "The hotline command: a desk with no window, run by systemd on a server, and the few commands an operator runs beside it over SSH."
version.workspace = true
edition.workspace = true

[[bin]]
name = "hotline"
path = "src/main.rs"

[dependencies]
hotline-core = { path = "../hotline-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3.34"
getrandom = "0.3"
hex = "0.4"
qrcode = { version = "0.14", default-features = false }
chrono.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
