[package]
name = "toad-core"
description = "Toad's core: the log, the room, sessions and their drivers, tools, and the wire. No Tauri dependency by design."
version.workspace = true
edition.workspace = true

[dependencies]
rig.workspace = true
async-trait = "0.1.92"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "process", "time", "sync"] }
chrono.workspace = true
rusqlite.workspace = true
cap-std = "4.0.3"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
globset = "0.4.20"
futures-util = "0.3.34"
tokio-tungstenite = "0.30"
uuid = { version = "1.26.0", features = ["v4"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
# Pinned: the two features below are the SDK's own "unstable", and a minor
# release is allowed to change them. `unstable_end_turn_token_usage` is how a
# turn's token count reaches the tape; `unstable_session_fork` is how the
# session's fork capability is reported honestly rather than as a flat no.
agent-client-protocol = { version = "=2.0.0", features = ["unstable_end_turn_token_usage", "unstable_session_fork"] }
# `compat`: the ACP SDK speaks futures-io and the child speaks tokio-io.
tokio-util = { version = "0.7", features = ["compat"] }
# Only the day-cached fetch of the ACP registry's catalogue, so the smallest
# client that can speak HTTPS and read JSON. `rustls` is named rather than
# inherited from rig's copy, because a dependency that quietly loses TLS when
# another crate stops asking for it is a fetch that fails and says nothing.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
url = "2.5.8"
# OpenRouter PKCE and xAI's device flow; inference remains on Rig.
oauth2 = { version = "5", default-features = false }
bytes = "1"
http = "1"
# Both halves of MCP on one version: Toad is a client of the servers a
# teammate is granted and the server of its own teammate tools. Pinned exactly,
# because the model types are `non_exhaustive` and a minor release is free to
# grow a field the compiler then demands.
rmcp = { version = "=3.2.0", features = [
    "auth",
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "reqwest",
] }
# rmcp's server side is a tower service and nothing more, so something has to
# hold the socket. axum is what rmcp's own examples serve it with, and the
# bearer check in front of it is one layer.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }

# Killing a command's whole process group, which is the only way Stop reaches
# what the command itself started.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
