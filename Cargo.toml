[workspace]
resolver = "3"
members = ["crates/hotline-core", "crates/hotline-app", "crates/hotline-cli"]

[workspace.package]
version = "0.39.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

# Lint levels, read by every crate through `[lints] workspace = true`. Clippy
# keeps its defaults; each pedantic or restriction lint here was chosen one by
# one and the tree was clean of it first (docs/audits/0.40/lints.md says which
# were left off and why). `make check` adds `-D warnings`, which turns each
# `warn` into a failure there while an editor's plain clippy only warns.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
keyword_idents = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Nothing in the tree hits these; they keep the door shut.
dbg_macro = "deny"
empty_drop = "deny"
get_unwrap = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
verbose_file_reads = "deny"
# Every suppression says why, so it can be judged when its reason is gone.
allow_attributes_without_reason = "warn"
# Pedantic and restriction lints the tree was made clean of.
assert_is_empty = "warn"
assigning_clones = "warn"
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
default_trait_access = "warn"
duration_suboptimal_units = "warn"
equatable_if_let = "warn"
explicit_iter_loop = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
iter_on_single_items = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_fields_in_debug = "warn"
needless_raw_string_hashes = "warn"
nonminimal_bool = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
single_option_map = "warn"
stable_sort_primitive = "warn"
suspicious_operation_groupings = "warn"
trivially_copy_pass_by_ref = "warn"
tuple_array_conversions = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_literal_bound = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
used_underscore_binding = "warn"

[workspace.dependencies]
# Without `derive`: nothing here uses Rig's derive macros, and they bring a
# proc-macro crate into every build.
rig = { version = "0.42.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: an event read from a tape and written back keeps the key
# order it was written with, so a compaction never rewrites a line into
# different bytes — and a tape from the previous edition stays the same file.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["rt", "sync"] }
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Image codecs are built optimised in every profile. Unoptimised, decoding
# and shrinking one phone photo takes seven seconds on the runtime thread;
# optimised it is a fraction of one. These crates are leaves and never
# stepped through in a debugger.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3

# The desk's speech models are half a gigabyte: a download is hashed and
# unpacked as it arrives, and each file is hashed again the first time it
# loads. Unoptimised, that is a minute where it should be seconds; the AAC
# decoder is the same story for a phone's clip.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.libbz2-rs-sys]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3

# sherpa-onnx-sys 1.13.8 as released builds with ZIP 2, which three extraction
# advisories (RUSTSEC-2026-0367, 0368, 0369) cover and only ZIP 9 fixes. This
# upstream commit is that release with ZIP 9 and no other change to the crate,
# so it links the same v1.13.8 archives `scripts/speech-engine.sha256` pins.
# Drop it for the first crates.io release that carries the change (k2-fsa/sherpa-onnx#4059).
[patch.crates-io]
sherpa-onnx-sys = { git = "https://github.com/k2-fsa/sherpa-onnx", rev = "1a9d234ab95567eba8c2e89873a87d70b79633e2" }
