<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 64 64" role="img" aria-label="Hotline">
	<!--
		The Hotline mark at 24px and under, and the drawing the working glyph moves: the
		brow. The receiver's cut is widened from 2.4 to 3.4 units, so it stays about a
		pixel at 16px instead of fusing the handset and eyes into goggles, and the handset
		is slim, with short lips and a straight handle across the cup tops, so at a glance
		it is a toad with a heavy brow and the receiver is the second look.
		receiverPath(RECEIVER_SMALL) from ui/src/ui/receiver.ts, written out.
	-->
	<mask id="hotline-pupils-small" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
		<rect width="64" height="64" fill="#fff" />
		<rect x="14.5" y="28" width="11" height="4" rx="2" fill="#000" />
		<rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />
	</mask>
	<g fill="currentColor">
		<g mask="url(#hotline-pupils-small)">
			<rect x="4" y="30" width="56" height="18" rx="6" />
			<circle cx="20" cy="30" r="10.5" />
			<circle cx="44" cy="30" r="10.5" />
		</g>
		<path d="M3.83 22.8A17.7 17.7 0 0 1 20 12.3L44 12.3A17.7 17.7 0 0 1 60.17 22.8A1.9 1.9 0 0 1 56.7 24.35A13.9 13.9 0 0 0 44 16.1L20 16.1A13.9 13.9 0 0 0 7.3 24.35A1.9 1.9 0 0 1 3.83 22.8Z" />
	</g>
</svg>
