<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Toad">
	<!--
		The Toad mark.

		A toad's eyes sit on top of its head and break the outline, and its pupil is a
		horizontal slit — those two facts are the whole mark. Everything else is a flat
		body cut off by the waterline it is sitting in.

		One colour, so it works on any background. The pupils are punched through
		rather than painted, so there is never a second fill to keep in sync.
	-->
	<mask id="toad-pupils" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
		<rect width="64" height="64" fill="#fff" />
		<rect x="14.5" y="28" width="11" height="4" rx="2" fill="#000" />
		<rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />
	</mask>
	<g mask="url(#toad-pupils)" fill="currentColor">
		<rect x="4" y="30" width="56" height="18" rx="6" />
		<circle cx="20" cy="30" r="10.5" />
		<circle cx="44" cy="30" r="10.5" />
	</g>
</svg>
