# cargo-deny's policy for Cargo.lock. `make check` and CI run its
# advisories and licenses checks; bans are not gated yet.
#
# Every target's dependencies are checked, not only the host's, because the
# Linux GTK and D-Bus crates below never build on a Mac.
#
# A vulnerability, an unsound crate or a yanked version fails the check. So
# does an unmaintained crate anywhere in the graph, unless it is listed below
# by ID with what it comes through and when to look again. No vulnerability
# is ignored. ZIP's extraction advisories (RUSTSEC-2026-0367, 0368, 0369) are
# avoided by two choices, each explained where it is made, and this check
# fails if either is undone: the updater is built without its `zip` feature
# (crates/hotline-app/Cargo.toml), and sherpa-onnx-sys is patched to an
# upstream commit that takes ZIP 9 (the root Cargo.toml).
#
# A crate under a license outside the [licenses] list fails, and so does one whose
# license cargo-deny cannot read with confidence. Each entry was read for
# what it obliges, and THIRD-PARTY-NOTICES.md says what that is and which
# crates bring it. A crate offering a choice passes when any one of its
# licenses is here: r-efi's LGPL-2.1-or-later is an alternative to MIT and
# Apache-2.0, never the one taken.

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # Run time, voice calls only: crypto-bigint 0.5.5 (RUSTSEC-2026-0387,
    # timing variability in constant-time operations) under elliptic-curve
    # 0.13 / p256 0.13, which webrtc's rtc-dtls 0.20 uses for the DTLS
    # handshake of a call's media. Only a call's key exchange runs through
    # it, and timing it needs an attacker measuring that handshake on the
    # path. No webrtc release takes crypto-bigint >= 0.7.6 yet. Remove when
    # rtc-dtls moves to the RustCrypto 0.14 crates.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via p256 0.13 in webrtc's rtc-dtls 0.20 (call DTLS only); remove when rtc-dtls takes crypto-bigint >= 0.7.6" },

    # Build time only: a proc macro under gtk-rs 0.18's glib-macros, which
    # Tauri's Linux tray and dialogs use. Look again when Tauri moves off GTK 3.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 via glib-macros 0.18 (Tauri on Linux); review when Tauri leaves gtk-rs 0.18" },

    # Build time and run time: urlpattern 0.3 under tauri-utils, which both
    # tauri-build and tauri link. Look again when urlpattern drops rust-unic.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9 via urlpattern 0.3 (tauri-utils); review when urlpattern or tauri-utils drops it" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9 via urlpattern 0.3 (tauri-utils); review when urlpattern or tauri-utils drops it" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9 via urlpattern 0.3 (tauri-utils); review when urlpattern or tauri-utils drops it" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9 via urlpattern 0.3 (tauri-utils); review when urlpattern or tauri-utils drops it" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9 via urlpattern 0.3 (tauri-utils); review when urlpattern or tauri-utils drops it" },

    # Run time on Linux: zbus 5.19 for D-Bus, under notify-rust (the
    # notification plugin) and the opener plugin. zbus folded these crates
    # into itself (z-galaxy/zbus#2043). Look again when a zbus release
    # without them reaches those two plugins.
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15 via zbus 5.19 (notification and opener plugins on Linux); review when they take a zbus without it" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3 via zbus 5.19 (notification and opener plugins on Linux); review when they take a zbus without it" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15 via zbus 5.19 (notification and opener plugins on Linux); review when they take a zbus without it" },
]

[licenses]
allow = [
    # Permissive, with the copyright and license kept beside a copy.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "bzip2-1.0.6",
    # Public domain or its equivalent: nothing to keep.
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    # The Mozilla root certificates in webpki-roots, as data.
    "CDLA-Permissive-2.0",
    # File-level copyleft: a changed MPL file is published with its source.
    # Hotline changes none (cssparser, selectors and symphonia among them).
    "MPL-2.0",
]
